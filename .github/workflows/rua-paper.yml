# 루아 신문 종이판 인쇄 파일 만들기 (v185)
# 새 신문(gunggeum/news/latest.json)이 main에 올라오면 A4 인쇄용 그림을 만들어 'paper' 가지에 올린다.
# 'paper' 가지는 늘 커밋 하나만 남기고 덮어쓴다(저장소가 매일 커지지 않게). 폴드4의 자동 인쇄가 여기서 받는다.
name: rua-paper
on:
  push:
    branches: [main]
    paths: ['gunggeum/news/latest.json', 'gunggeum/paper.html', 'gunggeum/tools/paper-render.js']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: rua-paper, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 브라우저 준비
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 종이판 만들기
        run: NODE_PATH=$PWD/node_modules node gunggeum/tools/paper-render.js
      - name: paper 가지에 올리기
        run: |
          cd gunggeum/news/paper
          git init -q -b paper
          git config user.name "rua-paper"
          git config user.email "rua-paper@users.noreply.github.com"
          git add .
          git commit -q -m "종이판 $(node -p "require('./latest.json').date")"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" paper:paper
