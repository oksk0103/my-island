<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 한 조각</title>
<style>
@font-face{font-family:"Pretendard";src:url("../fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
/* 크기 5단계: 80 / 56 / 40 / 30 / 24(최소) */
:root{--ink:#1C211E;--body:#3D423F;--muted:#777970;--blue:#0B5BB0;--moon:#F6E7BC;--orange:#FF9B3D;--line:rgba(28,33,30,.12)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E9E8E4;overflow:hidden;font-family:"Pretendard","Noto Sans CJK KR","Noto Sans KR",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:820px;flex:none;transform-origin:center;overflow:hidden;
 background:radial-gradient(120% 90% at 15% 0,rgba(255,255,255,.7),transparent 60%),linear-gradient(#F8F7F4,#EDECE8)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none;padding:0}
.scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s .22s}
.scr.on{opacity:1;visibility:visible;transition:opacity .22s ease}
/* 편 고르기 (시안용) */
#pick{padding:80px 136px 0}
#pick h1{margin:0 0 10px;font-size:56px;font-weight:750;letter-spacing:-.025em}
#pick .sub{font-size:24px;color:var(--muted);margin-bottom:36px}
.wk{font-size:24px;font-weight:700;color:var(--muted);margin:6px 0 12px}
.cards{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:26px}
.card{text-align:left;background:rgba(255,255,255,.72);border-radius:24px;padding:20px 20px;min-height:170px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(30,40,60,.06);display:flex;flex-direction:column;gap:10px;transition:transform .15s ease}
.card:active{transform:scale(.98)}
.card .d{font-size:24px;font-weight:700;color:var(--blue)}
.card .q{font-size:30px;font-weight:750;line-height:1.25;letter-spacing:-.02em;word-break:keep-all}
.card .t{font-size:24px;color:var(--muted);margin-top:auto}
/* 홈 */
#home{background:center/1600px 820px no-repeat}
#homeHit{position:absolute;left:42px;top:150px;width:1000px;height:620px;border-radius:40px}
.tapme{position:absolute;left:96px;top:582px;width:140px;height:64px;border-radius:32px;animation:ping 2.4s ease-out 1s 3}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
#toPick{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);height:44px;padding:0 22px;border-radius:22px;background:rgba(0,0,0,.28);color:#fff;font-size:24px;font-weight:600}
/* 머리줄 */
.top{position:absolute;left:48px;right:48px;top:40px;height:64px;display:flex;align-items:center;gap:26px;z-index:3}
.logo{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03);display:grid;place-items:center}
.logo svg{width:56%;height:56%}
.ttl{font-size:27px;font-weight:650;letter-spacing:-.01em}
.ttl small{font-size:24px;font-weight:450;color:var(--muted);margin-left:12px}
.clock{margin-left:auto;font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}
.clock small{font-size:24px;font-weight:450;color:var(--muted);margin-right:8px}
/* 바닥줄 */
.nav{position:absolute;left:136px;right:48px;bottom:34px;height:64px;display:flex;align-items:center;gap:20px;z-index:3}
.pill{height:64px;padding:0 30px;border-radius:32px;font-size:24px;font-weight:650;display:inline-flex;align-items:center;gap:12px;transition:transform .15s ease}
.pill:active{transform:scale(.97)}
.pill.dark{background:var(--ink);color:#fff}
.pill.soft{background:rgba(28,33,30,.07)}
.pill svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:10px;margin:0 auto}
.dots i{width:10px;height:10px;border-radius:5px;background:rgba(28,33,30,.18);transition:width .2s ease,background-color .2s ease}
.dots i.on{width:30px;background:var(--ink)}
.hint{font-size:24px;color:var(--muted)}
/* 본문 틀 */
.L{position:absolute;left:136px;top:150px;width:580px}
.tile{position:absolute;left:760px;top:150px;width:792px;height:540px;border-radius:32px;background:linear-gradient(#143565,#0E2B55);box-shadow:0 10px 30px rgba(18,48,94,.18);overflow:hidden}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.k{font-size:24px;font-weight:600;color:var(--muted);margin:0 0 20px}
.k b{color:var(--blue);font-weight:700;margin-right:10px}
h2{margin:0;font-size:56px;line-height:1.25;font-weight:750;letter-spacing:-.025em;word-break:keep-all}
p.b{margin:28px 0 0;font-size:30px;line-height:1.55;color:var(--body);word-break:keep-all}
p.b em{font-style:normal;font-weight:700;color:var(--ink)}
.act{position:absolute;left:136px;top:580px}
svg text{font-family:"Pretendard","Noto Sans CJK KR",sans-serif}
.t24{font-size:24px;font-weight:600;fill:var(--moon)}
.t24m{font-size:24px;font-weight:500;fill:rgba(246,231,188,.6)}
.t30{font-size:30px;font-weight:600;fill:var(--moon)}
.t40{font-size:40px;font-weight:750;fill:var(--moon)}
.t56{font-size:56px;font-weight:750;fill:var(--moon)}
.t80{font-size:80px;font-weight:750;fill:var(--moon)}
.or{fill:#FFB15E!important}
.bl{fill:#8FBCF0!important}
.dim{fill:rgba(246,231,188,.35)!important}
#cover h2{font-size:80px;line-height:1.18}
#cover .guess{margin-top:36px;font-size:30px;color:var(--muted)}
/* 정리 */
#sum .L{top:0;bottom:120px;width:640px;display:flex;flex-direction:column;justify-content:center;padding-top:110px}
.sum{list-style:none;margin:0;padding:0;counter-reset:s}
.sum li{counter-increment:s;display:grid;grid-template-columns:60px 1fr;font-size:40px;font-weight:650;line-height:1.35;letter-spacing:-.02em;padding:22px 0;border-bottom:1px solid var(--line);word-break:keep-all}
.sum li:first-child{border-top:1px solid var(--line)}
.sum li::before{content:counter(s);font-weight:750;color:var(--blue)}
.words{position:absolute;left:840px;right:48px;top:110px;bottom:120px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.word{background:rgba(255,255,255,.72);border-radius:28px;padding:24px 36px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(30,40,60,.06);display:grid;grid-template-columns:170px 1fr;align-items:center}
.word b{font-size:40px;font-weight:750;letter-spacing:-.02em}
.word span{font-size:30px;line-height:1.4;color:var(--body);word-break:keep-all}
/* 마무리 */
#end .top30{position:absolute;left:136px;top:150px;width:900px;font-size:30px;line-height:1.5}
#end .top30 .q{font-weight:700}
#end .top30 .a{color:var(--body);opacity:0;transition:opacity .25s ease}
#end .top30 .a.show{opacity:1}
#end .main{position:absolute;left:136px;top:330px;width:900px}
#end .tile{left:1112px;top:230px;width:440px;height:440px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

<section class="scr on" id="cover" data-k="cover">
  <div class="L" style="width:620px;top:170px">
    <div class="k" id="cvK"></div>
    <h2 id="cvH"></h2>
    <div class="guess">네 생각은? 짐작해 보고 넘겨 봐.</div>
  </div>
  <div class="tile" id="cvTile"><svg id="cvSvg" viewBox="0 0 792 540"></svg></div>
</section>

<section class="scr" id="s0" data-k="s0"></section>
<section class="scr" id="s1" data-k="s1"></section>
<section class="scr" id="s2" data-k="s2"></section>

<section class="scr" id="sum" data-k="sum">
  <div class="L"><div class="k"><b>정리</b>세 줄로</div><ol class="sum" id="sumList"></ol></div>
  <div class="words" id="words"></div>
</section>

<section class="scr" id="end" data-k="end">
  <div class="top30"><div class="k" style="margin-bottom:10px"><b>떠올려 보기</b></div>
    <div class="q" id="rcQ"></div><div class="a" id="rcA"></div></div>
  <div class="main"><div class="k"><b>오늘</b></div><h2 id="endH"></h2></div>
  <div class="tile"><svg id="endSvg" viewBox="0 0 440 440"></svg></div>
</section>

<header class="top" id="top">
  <button class="logo" id="logo" aria-label="홈으로"><svg viewBox="96 92 320 360"><path d="M116 112H206V169H116V226H206" fill="none" stroke="#1C211E" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="348" cy="169" r="46" fill="none" stroke="#1C211E" stroke-width="28"/><path d="M128 296C186 366 320 372 386 288" fill="none" stroke="#1C211E" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="258" cy="412" r="24" fill="#FF9B3D"/></svg></button>
  <div class="ttl">오늘의 한 조각<small>국어</small></div>
  <div class="clock" id="clock"></div>
</header>
<nav class="nav" id="nav">
  <button class="pill soft" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>앞</button>
  <div class="dots" id="dots"></div>
  <button class="pill dark" id="next"></button>
</nav>

</div></div>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',SYN=29.530588853;
const fit=()=>{$('stage').style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/820)})`;};addEventListener('resize',fit);fit();
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const tx=(p,x,y,s,cls,anc='start',extra={})=>{const e=el('text',Object.assign({x,y,class:cls,'text-anchor':anc},extra),p);e.textContent=s;return e;};
const grp=(p,o=1,extra={})=>el('g',Object.assign({opacity:o,style:'transition:opacity .3s ease'},extra),p);
const show=g=>g.setAttribute('opacity',1);
const anim=(D,fn,end)=>{const t0=performance.now();const f=t=>{const x=Math.min(1,(t-t0)/D);fn(x);if(x<1)requestAnimationFrame(f);else if(end)end();};requestAnimationFrame(f);};
const pillR=(p,x,y,w,h,fill)=>el('rect',{x,y,width:w,height:h,rx:h/2,fill},p);
const box=(p,x,y,w,h,fill='rgba(246,231,188,.08)',r=18)=>el('rect',{x,y,width:w,height:h,rx:r,fill},p);
// 달
function moonPath(f,r){f=((f%1)+1)%1;const k=Math.cos(2*Math.PI*f),rx=Math.abs(k)*r;
  return f<=.5?`M0,${-r}A${r},${r} 0 0 1 0,${r}A${rx},${r} 0 0 ${k>0?0:1} 0,${-r}Z`:`M0,${-r}A${r},${r} 0 0 0 0,${r}A${rx},${r} 0 0 ${k<0?0:1} 0,${-r}Z`;}
function moon(p,cx,cy,r,day){const g=el('g',{transform:`translate(${cx},${cy})`},p);
  el('circle',{r,fill:'none',stroke:'rgba(246,231,188,.28)','stroke-width':Math.max(1.5,r/50),'stroke-dasharray':r>40?'6 7':'3 4'},g);
  const lit=el('path',{fill:'#F6E7BC'},g);const set=d=>{lit.setAttribute('d',d<1.5||d>29.5?'':moonPath((d-1+.5)/SYN,r));};set(day);return {g,set};}
const NAME=d=>d<=1?'초하루':d<=5?'초승달':d<=10?'차는 반달':d<=13?'차는 달':d<=17?'보름':d<=20?'기우는 달':d<=24?'기우는 반달':d<=29?'그믐달':'초하루';
// 꽃(무궁화를 단순한 도형으로)
function flower(p,cx,cy,r){const g=el('g',{transform:`translate(${cx},${cy})`},p);const pet=el('g',{},g);
  for(let i=0;i<5;i++)el('ellipse',{cx:0,cy:-r*.55,rx:r*.42,ry:r*.55,fill:'#F6E7BC',transform:`rotate(${i*72})`},pet);
  el('circle',{r:r*.28,fill:'#E0703A'},g);const set=s=>{g.setAttribute('transform',`translate(${cx},${cy}) scale(${Math.max(.001,s)})`);};return {g,set};}
// 낱말 합치기 줄: a + b → c, 덧붙는 자음 배지
function joinRow(p,y,a,b,c,badge,note){const g=grp(p,0);
  tx(g,60,y,a,'t56');tx(g,60+a.length*58+14,y,'+','t40 dim');tx(g,60+a.length*58+60,y,b,'t56');
  tx(g,390,y,'→','t40 dim');tx(g,446,y,c,'t56');
  if(badge){pillR(g,660,y-44,92,52,'#FF9B3D');tx(g,706,y-8,badge,'t30','middle',{style:'fill:#fff;font-weight:750'});}
  if(note)tx(g,446,y+40,note,'t24m');return g;}

// ===================== 편 정의 =====================
const EP=[];

// ---------- 1. 음력 ----------
EP.push({day:'1일차',topic:'음력과 윤달',cat:'국어 상식',img:'home-1.png',
 cover:{h:'설날은 왜 해마다<br>날짜가 바뀔까?',draw(S){const m=moon(S,396,240,170,1),l=tx(S,396,500,'초하루 · 음력 1일','t24','middle');
   return ()=>anim(8000,x=>{const d=1+(1-Math.pow(1-x,2.2))*14;m.set(d);const di=Math.round(d);l.textContent=di>=15?'보름 · 음력 15일쯤':`${NAME(di)} · 음력 ${di}일`;});}},
 scenes:[
  {k:'하늘이 달력',h:'옛날엔<br>달 모양이 달력이었다',b:'해는 날마다 똑같아서<br>날짜를 알려 주지 못해.<br>달 모양은 다시 같아지기까지<br><em>29.5일쯤</em> 걸려.',steps:['한 달 돌려 보기','달 이름 펼치기'],
   draw(S){const big=moon(S,396,140,100,1),bl=tx(S,396,285,'초하루 · 음력 1일 · 안 보여','t24','middle');const SX=36,CW=24,SY=320,cells=[];
    for(let d=1;d<=30;d++){const x=SX+(d-1)*CW;box(S,x+1,SY,CW-2,28,'rgba(246,231,188,.07)',5);const g=el('g',{opacity:0},S);moon(g,x+CW/2,SY+14,9,d);cells.push(g);if(d===1||d%5===0)tx(S,x+CW/2,SY+62,String(d),'t24m','middle');}
    tx(S,SX+30*CW+2,SY+62,'일','t24m');
    const KEY=[[1,'초하루','1일'],[3,'초승달','3일쯤'],[8,'차는 반달','8일쯤'],[15,'보름달','15일쯤'],[22,'기우는 반달','22일쯤'],[27,'그믐달','27일쯤']];const ng=grp(S,0);
    KEY.forEach(([d,n,dl],i)=>{const cx=SX+(d-1)*CW+CW/2,nx=80+i*126;el('path',{d:`M${cx},${SY+30}L${cx},${SY+72}L${nx},${SY+92}`,fill:'none',stroke:'rgba(246,231,188,.35)','stroke-width':1.5},ng);
     const b=el('g',{style:'cursor:pointer'},ng);el('rect',{x:nx-60,y:SY+92,width:120,height:122,fill:'transparent'},b);moon(b,nx,SY+124,22,d);tx(b,nx,SY+178,n,'t24','middle');const dt=tx(b,nx,SY+208,'?','t24m','middle');
     b.addEventListener('click',()=>{dt.textContent=dt.textContent==='?'?dl:'?';big.set(d);bl.textContent=`${n} · 음력 ${dl}`;});});
    return i=>{if(i===0){cells.forEach(c=>c.setAttribute('opacity',0));anim(8000,x=>{const d=1+x*29;big.set(d);const di=Math.min(30,Math.floor(d));bl.textContent=`${NAME(di)} · 음력 ${di}일`;cells.forEach((c,j)=>{if(j<di)c.setAttribute('opacity',1);});},()=>{big.set(1);bl.textContent='다시 초하루 · 한 바퀴 29.5일쯤';});}
     else{show(ng);cells.forEach((c,j)=>{if(!KEY.some(([d])=>d===j+1))c.setAttribute('opacity',.3);});bl.textContent='아래 달을 눌러 며칠쯤인지 확인해 봐';}};}},
  {k:'양력과 음력',h:'달로 한 해를 세면<br>11일이 모자라',b:'계절이 한 바퀴 도는 데 <em>365일</em>.<br>달 모양은 12번 돌아도 <em>354일</em>.<br>그대로 두면 열여섯 해쯤 뒤엔<br>설날이 한여름에 와.',steps:['달 12번 채우기'],
   draw(S){const BX=48,BW=696,PX=BW/365;tx(S,BX,110,'양력 한 해','t24');tx(S,BX+BW,114,'365일','t40','end');el('rect',{x:BX,y:132,width:BW,height:72,rx:14,fill:'#5A9BE6'},S);
    [0,31,59,90,120,151,181,212,243,273,304,334].forEach((a,i)=>{if(a)el('line',{x1:BX+a*PX,x2:BX+a*PX,y1:138,y2:198,stroke:'rgba(255,255,255,.35)','stroke-width':2},S);tx(S,BX+(a+15)*PX,178,String(i+1),'t24','middle',{style:'fill:#fff'});});
    tx(S,BX,300,'음력 한 해','t24');const tot=tx(S,BX+BW,304,'0일','t40','end');box(S,BX,322,BW,72,'rgba(246,231,188,.07)',14);
    const segs=[];for(let i=0;i<12;i++){const g=grp(S,0);const x=BX+i*29.5*PX;el('rect',{x:x+2,y:322,width:29.5*PX-4,height:72,rx:10,fill:'#F6E7BC'},g);tx(g,x+29.5*PX/2,368,String(i+1),'t24','middle',{style:'fill:#12305E;font-weight:700'});segs.push(g);}
    const gap=grp(S,0),gx=BX+354*PX;el('rect',{x:gx+3,y:322,width:11*PX-5,height:72,rx:8,fill:'none',stroke:'#FF9B3D','stroke-width':3,'stroke-dasharray':'6 5'},gap);tx(gap,BX+BW,446,'11일 모자라','t24 or','end');tx(S,BX,446,'달 모양 12번','t24m');
    return ()=>{let i=0;const n=()=>{if(i<12){show(segs[i]);i++;tot.textContent=(i===12?354:Math.round(i*29.5))+'일';setTimeout(n,380);}else show(gap);};n();};}},
  {k:'윤달',h:'모자란 날이 쌓이면<br>한 달을 끼워 넣어',b:'설날은 해마다 <em>11일쯤 빨라져</em>.<br>윤달이 낀 다음 해엔<br><em>19일쯤 늦어지고</em>.',steps:['한 해씩 보기','다음 해','다음 해','다음 해','다음 해','다음 해'],
   draw(S){const SEOL=[[2020,25,'1월 25일'],[2021,43,'2월 12일'],[2022,32,'2월 1일'],[2023,22,'1월 22일'],[2024,41,'2월 10일'],[2025,29,'1월 29일'],[2026,48,'2월 17일']],LEAP={2020:1,2023:1,2025:1};
    const RX0=140,RX1=470,dx=d=>RX0+(d-20)*(RX1-RX0)/31,RY=i=>132+i*52;el('line',{x1:RX0,x2:RX1,y1:84,y2:84,stroke:'rgba(246,231,188,.5)','stroke-width':2},S);
    for(let d=20;d<=51;d++){const bg=d===20||d===32||d===51;el('line',{x1:dx(d),x2:dx(d),y1:bg?72:79,y2:89,stroke:bg?'rgba(246,231,188,.9)':'rgba(246,231,188,.35)','stroke-width':bg?3:1.5},S);}
    tx(S,dx(20),58,'1월 20일','t24m','middle');tx(S,dx(32),58,'2월 1일','t24','middle');tx(S,dx(51),58,'2월 20일','t24m','middle');
    tx(S,396,516,'← 일찍          늦게 →','t24m','middle',{style:'white-space:pre'});el('line',{x1:dx(32),x2:dx(32),y1:100,y2:500,stroke:'rgba(246,231,188,.12)','stroke-width':2,'stroke-dasharray':'4 6'},S);

// 공용: 칸 여러 개(누르면 답), 줄 여러 개(차례로 나타남)
function cardGrid(S,items,{cols=2,w=340,h=118,gap=16,fs=40,x0=40,y0=40}={}){return items.map(([a,b],i)=>{const x=x0+(i%cols)*(w+gap),y=y0+Math.floor(i/cols)*(h+gap);
  const g=el('g',{style:'cursor:pointer'},S);box(g,x,y,w,h,'rgba(246,231,188,.08)',22);tx(g,x+24,y+h/2+fs*.36,a,'t40','start',{style:`font-size:${fs}px`});
  const q=tx(g,x+w-24,y+h/2+fs*.36,'?','t40 dim','end',{style:`font-size:${fs*.8}px`});const done=()=>{q.textContent=b;q.setAttribute('class','t40 or');};g.addEventListener('click',done);return done;});}
function rowsList(S,rows,{y0=100,dy=120,fs=40}={}){return rows.map((r,i)=>{const g=grp(S,0),y=y0+i*dy;r(g,y,fs);return g;});}
const mark=(g,x,y,ok)=>tx(g,x,y,ok?'맞아':'어색해','t30 '+(ok?'bl':'or'),'end',{style:'font-weight:750'});
const sentence=(g,x,y,parts,fs=40)=>{let cx=x;parts.forEach(([t,c])=>{const e=tx(g,cx,y,t,c||'t40','start',{style:`font-size:${fs}px`});cx+=e.getComputedTextLength()+2;});};
const qmark=S=>tx(S,220,250,'?','t80','middle',{style:'fill:rgba(246,231,188,.5)'});
function endCard(S,lines){const q=qmark(S),g=grp(S,0);lines.forEach(([t,c,y])=>tx(g,220,y,t,c,'middle'));return ()=>{q.remove();show(g);};}

// 깃털과 이름표 (시치미)
function feathers(S,cx,cy,n=5){const g=el('g',{},S);for(let i=0;i<n;i++){const a=-30+i*(60/(n-1));const f=el('g',{transform:`translate(${cx},${cy}) rotate(${a})`},g);
  el('ellipse',{cx:0,cy:-120,rx:26,ry:120,fill:'rgba(246,231,188,.85)'},f);el('line',{x1:0,y1:0,x2:0,y2:-236,stroke:'rgba(18,48,94,.55)','stroke-width':3},f);}return g;}
function nameTag(S,x,y,lines){const g=grp(S,0,{transform:`translate(${x},${y})`});el('line',{x1:0,y1:-46,x2:0,y2:0,stroke:'#FFB15E','stroke-width':3},g);
  el('rect',{x:-90,y:0,width:180,height:120,rx:16,fill:'#FFB15E'},g);lines.forEach((t,i)=>tx(g,0,46+i*40,t,'t24','middle',{style:'fill:#12305E;font-weight:700'}));return g;}

const closeMe=()=>{try{parent.postMessage({gk:'piece-close'},'*');}catch(e){}};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{try{parent.postMessage({gk:'piece-touch'},'*');}catch(e){}},true));
const tick=()=>{const d=new Date(),h=d.getHours();$('clock').innerHTML=`<small>${h===0?'밤':h<12?'오전':'오후'}</small>${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;};tick();setInterval(tick,15e3);
const P=new URLSearchParams(location.search),EI=Math.max(1,Math.min(EP.length,+P.get('ep')||1))-1;
let E=EP[EI],cur=0;const ORDER=['cover','s0','s1','s2','sum','end'],stepsDone={},runners={};let coverPlay=null;
window.__piece={id:EI+1,topic:E.topic};
const dots=$('dots');ORDER.forEach(()=>dots.appendChild(document.createElement('i')));
function clear(x){while(x.firstChild)x.removeChild(x.firstChild);}
$('cvK').innerHTML=`<b>${E.cat}</b>${E.topic}`;$('cvH').innerHTML=E.cover.h;coverPlay=E.cover.draw($('cvSvg'));document.title='오늘의 한 조각 — '+E.topic;
E.scenes.forEach((sc,j)=>{const x=$('s'+j);x.innerHTML=`<div class="L"><div class="k"><b>${j+1}</b>${sc.k}</div><h2>${sc.h}</h2><p class="b">${sc.b}</p></div><div class="tile"><svg viewBox="0 0 792 540"></svg></div>`;runners['s'+j]={steps:sc.steps,run:sc.draw(x.querySelector('svg'))};});
$('sumList').innerHTML=E.sum.lines.map(l=>`<li>${l}</li>`).join('');$('words').innerHTML=E.sum.words.map(([a,b])=>`<div class="word"><b>${a}</b><span>${b}</span></div>`).join('');
$('rcQ').textContent=E.end.q;$('rcA').textContent=E.end.a;$('endH').innerHTML=E.end.h;const rev=E.end.draw($('endSvg'));runners.end={steps:['답 보기',E.end.btn],run:i=>i===0?$('rcA').classList.add('show'):rev()};
const ARW='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const nextStep=k=>{const r=runners[k];return r?r.steps[stepsDone[k]||0]||null:null;};
function refresh(){const k=ORDER[cur],s=nextStep(k);$('next').innerHTML=(s||(k==='end'?'다 봤어':'다음'))+ARW;}
function go(i){i=Math.max(0,Math.min(ORDER.length-1,i));cur=i;const k=ORDER[i];document.querySelectorAll('.scr').forEach(x=>x.classList.toggle('on',x.dataset.k===k));
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));$('back').style.visibility=k==='cover'?'hidden':'visible';if(k==='cover'&&coverPlay)coverPlay();refresh();}
function doStep(){const k=ORDER[cur],s=nextStep(k);if(!s)return false;const n=stepsDone[k]||0;stepsDone[k]=n+1;runners[k].run(n);refresh();return true;}
function primary(){if(doStep())return;if(ORDER[cur]==='end')return closeMe();go(cur+1);}
$('logo').onclick=closeMe;$('next').onclick=primary;$('back').onclick=()=>go(cur-1);$('cvTile').onclick=()=>coverPlay&&coverPlay();
addEventListener('keydown',e=>{if(e.repeat)return;
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();primary();}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();if(cur>0)go(cur-1);}
  else if(['Escape','Home','F3'].includes(e.key)){e.preventDefault();closeMe();}});
go(0);
</script>
</body>
</html>
