<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루아 신문 종이판</title>
<!-- 루아 신문 종이판(A4 두 장, 컬러). 부모님 화면 '종이 신문'과 매일 아침 자동 인쇄(tools/paper-render.js → paper 가지)가 이 파일을 쓴다.
     화면판과 따로 짠다: 1면 = 머리기사·둘째 기사·짧은 소식, 2면 = 셋째 기사·오늘의 낱말·놀이터(낱말 찾기·미로·스도쿠).
     놀이는 날짜를 씨앗으로 이 파일이 만든다(점수·정답 맞히기 없음, 낱말 찾기 답만 작게). -->
<style>
@font-face{font-family:"MaruBuri";src:url("fonts/MaruBuri-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"MaruBuri";src:url("fonts/MaruBuri-SemiBold.woff2") format("woff2");font-weight:600}
@font-face{font-family:"MaruBuri";src:url("fonts/MaruBuri-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900}
@page{size:A4;margin:0}
:root{--ink:#16181F;--ink2:#555A66;--navy:#2C4287;--navy2:#18254E;--apricot:#D9822B;--cream:#F6F0E2;--sky:#E9EDF8;--rule:#16181F}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:"MaruBuri","Noto Serif KR",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.ink{filter:grayscale(1)}
.page{width:210mm;height:297mm;padding:10mm 11mm 8mm;overflow:hidden;position:relative;word-break:keep-all;overflow-wrap:break-word;break-after:page;display:flex;flex-direction:column}
.page:last-child{break-after:auto}
@media screen{body{background:#8a8a8a;padding:8mm 0}.page{background:#fff;margin:0 auto 8mm;box-shadow:0 2mm 8mm rgba(0,0,0,.35)}}
.sans{font-family:"Pretendard",sans-serif}

/* 제호 */
.mast img{height:16mm;display:block;margin:0 auto 1.6mm}
.meta{display:flex;justify-content:space-between;align-items:baseline;border-top:.7mm solid var(--rule);border-bottom:.25mm solid var(--rule);padding:1.3mm 0 1.1mm;font-family:"Pretendard",sans-serif;font-size:9.5pt}
.meta b{font-weight:700;color:var(--navy)}
.dbl{height:1.1mm;border-bottom:.25mm solid var(--rule);margin-bottom:3mm}
.run{display:flex;justify-content:space-between;align-items:baseline;font-family:"Pretendard",sans-serif;font-size:9pt;border-bottom:.7mm solid var(--rule);padding-bottom:1.3mm;margin-bottom:4mm}
.run b{font-family:"MaruBuri",serif;font-size:13pt}

/* 기사 */
.tag{display:inline-block;font-family:"Pretendard",sans-serif;font-size:8.5pt;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--navy);padding:.5mm 2.2mm .6mm;margin:0 0 1.6mm}
h1,h2{font-weight:700;margin:0;line-height:1.16;letter-spacing:-.025em;text-wrap:balance}
h1{font-size:25pt;margin-bottom:1.6mm}
h2{font-size:18pt;margin-bottom:1.4mm}
.lede{font-weight:600;font-size:12pt;line-height:1.45;margin:0 0 2.6mm;color:var(--navy2)}
.body{column-gap:5mm;column-rule:.2mm solid #b9bcc6}
.body p{font-size:10.2pt;line-height:1.5;margin:0 0 1.4mm;text-indent:1em}
.body p:first-child{text-indent:0}
.body b{font-weight:700;background:linear-gradient(transparent 62%,#F7D9A8 62%)}
.src{font-family:"Pretendard",sans-serif;font-size:7.5pt;color:var(--ink2);margin:1mm 0 0}
figure{margin:0}
figure img{width:100%;display:block}
figcaption{font-family:"Pretendard",sans-serif;font-size:8pt;color:var(--ink2);margin-top:1mm}

/* 1면 */
.p1{flex:1;display:grid;grid-template-columns:1fr 50mm;gap:0 5mm;min-height:0}
.main{display:flex;flex-direction:column;min-width:0}
.lead{padding-bottom:2.8mm;border-bottom:.25mm solid var(--rule)}
.lead .pic{display:grid;grid-template-columns:1fr 43mm;gap:0 5mm;align-items:center;margin-bottom:2mm}
.lead .lede{font-size:14pt;line-height:1.45;margin:0}
.lead .lede::before{content:'';display:block;width:12mm;height:.9mm;background:var(--apricot);margin-bottom:3mm}
.sidenum{margin:0}
.lead .num{margin:0;text-align:left;padding:1.6mm 0 1.8mm}
.lead .num strong{font-size:22pt}
.lead .pic .lede{font-size:15pt;line-height:1.5;margin:0;padding:0}
.lead .pic .lede::before{content:'';display:block;width:14mm;height:.9mm;background:var(--apricot);margin-bottom:3mm}
.num{border-top:.7mm solid var(--navy);border-bottom:.25mm solid var(--navy);padding:2.4mm 0;text-align:center;margin-bottom:3mm}
.num em{display:block;font-style:normal;font-family:"Pretendard",sans-serif;font-size:8pt;font-weight:800;letter-spacing:.14em;margin-bottom:1.6mm}
.num strong{display:block;font-size:28pt;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--navy)}
.num span{display:block;font-family:"Pretendard",sans-serif;font-size:8pt;color:var(--ink2);margin-top:1.2mm;line-height:1.35}
.lead .body{column-count:2}
.second{padding-top:2.8mm}
.second .body{column-count:2}
.pic2{display:grid;grid-template-columns:1fr 36mm;gap:0 5mm;align-items:center;margin-bottom:1.6mm}
.pic2 .lede{font-size:13pt;margin:0}
.side{background:var(--cream);padding:3.4mm 3.6mm;display:flex;flex-direction:column}
.side h3{font-family:"Pretendard",sans-serif;font-size:9.5pt;font-weight:800;letter-spacing:.14em;margin:0 0 2.4mm;padding-bottom:1.6mm;border-bottom:.6mm solid var(--ink)}
.brief{padding:0 0 2.3mm;margin-bottom:2.3mm;border-bottom:.2mm solid #b8ad92}
.brief:last-of-type{border-bottom:0;margin-bottom:0}
.brief .k{font-family:"Pretendard",sans-serif;font-size:8pt;font-weight:700;color:var(--apricot);letter-spacing:.08em}
.brief h4{font-size:12.5pt;font-weight:700;line-height:1.25;margin:.6mm 0 1.2mm;letter-spacing:-.02em}
.bimg{display:block;width:44%;margin:0 auto 1.4mm;mix-blend-mode:multiply}
.brief p{font-size:9.8pt;line-height:1.52;margin:0}
.brief .s{font-family:"Pretendard",sans-serif;font-size:7pt;color:var(--ink2);margin-top:.8mm}
.side .fill{flex:1}
.inside{border-top:.6mm solid var(--ink);padding-top:1.8mm;font-family:"Pretendard",sans-serif;font-size:8.5pt;line-height:1.5}
.inside b{display:block;font-size:8pt;letter-spacing:.12em;margin-bottom:.6mm}

/* 2면 */
.third{padding-bottom:3.4mm;border-bottom:.25mm solid var(--rule)}
.third .top{display:grid;grid-template-columns:1fr 58mm;gap:0 5mm;align-items:start}
.third .body{column-count:2}
.words{padding:3mm 0 3.2mm;border-bottom:.25mm solid var(--rule)}
.hd{font-family:"Pretendard",sans-serif;font-size:9.5pt;font-weight:800;letter-spacing:.14em;margin:0 0 2mm}
.wrow{display:grid;grid-template-columns:repeat(3,1fr);gap:0 5mm}
.w{display:grid;grid-template-columns:auto 1fr;gap:0 3mm;align-items:start}
.w+.w{border-left:.2mm solid #b9bcc6;padding-left:5mm}
.w .g{font-size:21pt;font-weight:700;line-height:1.05;color:var(--navy)}
.w .hj{font-size:9pt;color:var(--ink2);margin-bottom:.8mm}
.w .hj span{font-size:13pt;color:var(--ink);font-family:"Noto Serif KR","Noto Serif CJK KR",serif;margin-right:.5mm}
.w .m{font-size:10pt;line-height:1.42}
.play{flex:1;padding-top:3mm;display:flex;flex-direction:column;min-height:0}
.play .hd{display:flex;align-items:baseline;gap:3mm}
.play .hd small{font-weight:500;letter-spacing:0;color:var(--ink2);font-size:8.5pt}
.spot{display:grid;grid-template-columns:1fr 1fr;gap:0 5mm;margin-bottom:2.6mm}
.spot svg{width:100%;height:39mm;display:block}
.spot span{display:block;font-family:"Pretendard",sans-serif;font-size:8pt;color:var(--ink2);margin-top:.6mm}
.games{flex:1;display:grid;grid-template-columns:67mm 1fr 37mm;gap:0 5mm;min-height:0}
.game{display:flex;flex-direction:column;min-height:0}
.game h4{font-family:"Pretendard",sans-serif;font-size:10.5pt;font-weight:800;margin:0 0 .8mm;color:var(--navy)}
.game p{font-family:"Pretendard",sans-serif;font-size:8.6pt;line-height:1.35;margin:0 0 1.6mm;color:var(--ink)}
.wsrow{display:flex;gap:3mm;align-items:flex-start}
.ws{width:41mm;flex:none;display:grid;grid-template-columns:repeat(8,1fr);border:.5mm solid var(--navy);background:var(--sky)}
.ws i{font-style:normal;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:"Pretendard",sans-serif;font-weight:600;font-size:10pt;border-right:.15mm solid #c3cbe2;border-bottom:.15mm solid #c3cbe2}
.wl{display:flex;flex-direction:column;gap:.7mm;align-items:flex-start}
.wl span{font-family:"Pretendard",sans-serif;font-size:8.3pt;white-space:nowrap;font-weight:600;border:.25mm solid var(--navy);border-radius:3mm;padding:.3mm 2mm .4mm}
.maze{height:41mm;display:flex}
.maze svg{width:100%;height:100%}
.sd{display:grid;grid-template-columns:repeat(4,1fr);border:.6mm solid var(--navy);width:100%}
.sd i{font-style:normal;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:"Pretendard",sans-serif;font-weight:700;font-size:15pt;border-right:.15mm solid #9aa5c8;border-bottom:.15mm solid #9aa5c8;color:var(--navy2)}
.sd i:nth-child(4n+2){border-right:.5mm solid var(--navy)} .sd i:nth-child(n+5):nth-child(-n+8){border-bottom:.5mm solid var(--navy)}
.sd i.e{background:#fff} .sd i:not(.e){background:var(--sky)}
.ch{display:flex;flex-direction:column;gap:1.6mm}
.ch b,.ch i{display:flex;align-items:center;height:8.5mm;border:.3mm solid var(--navy);border-radius:2mm;padding:0 3mm;font-family:"Pretendard",sans-serif;font-style:normal;font-size:12pt;font-weight:700}
.ch b{background:var(--sky);color:var(--navy2)}
.ch i::before{content:'→';color:#9aa5c8;font-weight:500}
.ans{font-family:"Pretendard",sans-serif;font-size:6.5pt;color:#8a8f9c;margin-top:1.6mm;transform:rotate(180deg);text-align:left;line-height:1.35}
.foot{border-top:.7mm solid var(--rule);padding-top:1.2mm;margin-top:3mm;font-family:"Pretendard",sans-serif;font-size:7.5pt;color:var(--ink2);display:flex;justify-content:space-between}

/* ===== 세 장 판: 1면 머리기사·짧은 소식·낱말 / 2면 기사 둘 / 3면 생각과 놀이 ===== */
.body p{font-size:11pt;line-height:1.6}
.lead{border-bottom:0;padding-bottom:0}
.lead .pic{grid-template-columns:1fr 74mm;margin-bottom:4mm}
.lead .lw .num{margin-top:5mm;text-align:left;padding:2mm 0}
.lead .body p{font-size:11.8pt;line-height:1.68}
.lead .lede{font-size:16pt}
.p1b{border-top:.25mm solid var(--rule);margin-top:3.4mm}
.p1b .words{border-bottom:0;padding-bottom:0}
.half{flex:1;min-height:0;padding:0 0 4mm}
.half+.half{border-top:.25mm solid var(--rule);padding-top:4mm}
.half .hrow{display:grid;grid-template-columns:1fr 50mm;gap:0 6mm;align-items:center;margin-bottom:3mm}
.half .hrow .lede{font-size:14.5pt;line-height:1.5;margin:0}
.half h2{font-size:21pt;margin-bottom:2mm}
.half{display:flex;flex-direction:column;justify-content:center}
.half .tag{align-self:flex-start}
.half .body{column-count:3}
.p3h{display:flex;align-items:baseline;gap:3mm;margin:0 0 2.4mm}
.p3h b{font-family:"Pretendard",sans-serif;font-size:11pt;font-weight:800;letter-spacing:.14em}
.p3h small{font-family:"Pretendard",sans-serif;font-size:9pt;color:var(--ink2)}
.think{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm;padding-bottom:4mm;border-bottom:.25mm solid var(--rule)}
.tk h4{font-family:"Pretendard",sans-serif;font-size:12pt;font-weight:800;color:var(--navy);margin:0 0 1mm}
.tk p{font-family:"Pretendard",sans-serif;font-size:9.6pt;line-height:1.45;margin:0 0 2mm}
.tk .q{font-family:"MaruBuri",serif;font-size:13pt;font-weight:700;line-height:1.4;margin:0 0 2.4mm}
.wline{height:11mm;border-bottom:.3mm solid #9aa5c8;display:flex;align-items:flex-end;font-size:12pt;color:var(--ink2);padding-bottom:1.2mm}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-bottom:1mm}
.sides div{border:.35mm solid var(--navy);border-radius:2.5mm;padding:2mm 2.6mm 2.2mm;background:var(--sky)}
.sides div+div{background:var(--cream);border-color:#B98A3A}
.sides b{display:flex;align-items:center;gap:2mm;font-family:"Pretendard",sans-serif;font-size:10.5pt;font-weight:800}
.sides b::before{content:'';width:4.4mm;height:4.4mm;border:.4mm solid currentColor;border-radius:50%;background:#fff;flex:none}
.sides span{display:block;font-family:"Pretendard",sans-serif;font-size:8.8pt;line-height:1.4;margin-top:1mm}
.play3{flex:1;min-height:0;padding-top:3.4mm;display:flex;flex-direction:column}
.play3 .spot svg{height:56mm}
.g2{flex:1;min-height:0;display:grid;grid-template-columns:86mm 1fr;gap:0 7mm}
.g2 .ws{width:58mm}
.g2 .ws i{font-size:14pt}
.g2 .wl span{font-size:10pt}
.g2 .wl{gap:1.2mm}
.g2 .maze{height:auto;flex:1}
.endrow{display:grid;grid-template-columns:1fr 34mm;gap:0 6mm;align-items:end;border-top:.25mm solid var(--rule);padding-top:3mm;margin-top:3mm}
.endrow .say b{font-family:"Pretendard",sans-serif;font-size:9.5pt;font-weight:800;letter-spacing:.1em}
.endrow .say .wline{height:10mm}
.stk{display:flex;flex-direction:column;align-items:center;gap:1mm;font-family:"Pretendard",sans-serif;font-size:8pt;color:var(--ink2)}
.stk i{width:24mm;height:24mm;border:.4mm dashed #9aa5c8;border-radius:50%;display:block}


/* ===== 조판 A안: 고정 격자에 글을 붓고, 그림 높이가 남는 자리를 먹는다 ===== */
.page{--u:6.2mm}
.colv{overflow:hidden}
.flow p{margin:0;text-indent:1em;font-size:var(--fs,11pt);line-height:var(--u)}
.flow p:first-child{text-indent:0}
.flow b{font-weight:700;background:linear-gradient(transparent 62%,#F7D9A8 62%)}
.cell{position:relative;min-width:0}
.cell.r::before,.fg.r::before{content:'';position:absolute;left:-2.5mm;top:1.3mm;bottom:0;border-left:.2mm solid #b9bcc6}
.fg{position:relative;margin:0}
.fg .crop{overflow:hidden;margin-top:1.3mm;background:#fff}
.fg .crop img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.1)}
.fg figcaption{height:5mm;margin:0;padding-top:1.1mm;line-height:3.6mm;font-size:8pt;overflow:hidden}
.srcl{font-family:"Pretendard",sans-serif;font-size:7.5pt;color:var(--ink2);margin:0;height:var(--u);line-height:var(--u);text-align:right}
.deck{font-weight:600;color:var(--navy2);margin:0;letter-spacing:-.01em;text-wrap:balance}

/* 1면 */
.p1{grid-template-columns:1fr 55mm}
.lead{border:0;padding:0;flex:1;min-height:0;display:flex;flex-direction:column}
.lead h1{font-size:27pt;margin-bottom:2.2mm}
.lead .deck{font-size:15pt;line-height:1.42;padding-bottom:1.2mm}
.lead .deck::before{content:'';display:inline-block;width:9mm;height:.9mm;background:var(--apricot);vertical-align:.32em;margin-right:2.4mm}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 5mm}
.lead .num{margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;text-align:left;border-top:.7mm solid var(--navy);border-bottom:.25mm solid var(--navy)}
.lead .num div{display:flex;align-items:baseline;gap:3mm}
.lead .num em{margin:0 0 1.4mm}
.lead .num strong{font-size:27pt;flex:none}
.lead .num span{font-size:9pt;margin:0;line-height:1.35;color:var(--ink)}
.side{padding:3.2mm 3.6mm 2.6mm;justify-content:space-between;min-height:0}
.side h3{margin-bottom:0}
.brief{margin:0;padding:0;border:0}
.side hr{border:0;border-top:.2mm solid #b8ad92;margin:0;width:100%}
.brief h4{font-size:13pt;margin:.5mm 0 1mm}
.brief p{font-size:10.5pt;line-height:1.5}
.brief.haspic{flex:0 1 auto;display:flex;flex-direction:column;min-height:0}
.bimg{width:62%;flex:0 1 24mm;min-height:12mm;object-fit:cover;margin:0 auto 1mm}
.idx{border-top:.6mm solid var(--ink);padding-top:1.6mm;font-family:"Pretendard",sans-serif}
.idx b{display:block;font-size:8.5pt;font-weight:800;letter-spacing:.14em;margin-bottom:1mm}
.idx div{display:flex;gap:2mm;align-items:baseline;font-size:9.5pt;line-height:1.5}
.idx i{font-style:normal;font-weight:800;color:var(--navy);flex:none}
.p1b{margin-top:3mm}
.p1b .words{padding-top:2.4mm}

/* 2면 */
.p2{flex:1;min-height:0;display:flex;flex-direction:column}
.mod .tag{margin-bottom:1.4mm}
.mod h2{font-size:23pt;margin:0 0 1.6mm}
.mod.sub h2{font-size:20pt}
.mod .deck{font-size:13.5pt;line-height:1.4;padding-bottom:1.2mm}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 5mm}
.sep{border-top:.25mm solid var(--rule)}
.p2{box-sizing:border-box}

/* 3면: 빈 띠를 놀이판 크기로 메운다 */
.play3 .spot svg{height:auto}
.play3 .spot{margin-bottom:4mm}
.think .wline{height:12.5mm}
.think{padding-bottom:5mm}
.g2{grid-template-columns:92mm 1fr;gap:0 6mm}
.g2 .ws{width:66mm}
.g2 .ws i{font-size:15pt}
.g2 .maze{flex:none;height:auto}
.g2 .maze svg{height:auto}
/* ===== C안: 3면 놀이 ===== */
.play3 .spot svg{height:auto;aspect-ratio:202/126}
.play3 .spot{margin-bottom:3mm}
.g2{grid-template-columns:92mm 1fr;gap:0 6mm}
.g2 .ws{width:68mm}
.g2 .ws i{font-size:13pt}
.g2 .wl span{font-size:9.6pt}
.dots{flex:1;min-height:0;display:flex;border:.35mm solid var(--navy2);border-radius:1.6mm;background:#FBFAF5}
.dots svg{width:100%;height:100%}

/* ===== C안 3라운드: 3면 = 논술 두 줄 + 큰 놀이 1 + 작은 놀이 1. 가는 괘선, 미색 바탕, 살구·남색만. ===== */
.think3{display:grid;grid-template-columns:1fr 1.3fr;gap:0 8mm;padding-bottom:4mm;border-bottom:.25mm solid var(--rule)}
.think3>div{display:flex;flex-direction:column}
.think3 .wr{margin-top:auto}
.think3 h4,.big h4,.small h4{font-family:"Pretendard",sans-serif;font-size:11.5pt;font-weight:800;color:var(--navy);margin:0 0 .8mm}
.think3 p,.big>p,.small>p{font-family:"Pretendard",sans-serif;font-size:9.4pt;line-height:1.45;margin:0 0 1.6mm;color:var(--ink)}
.think3 .q{font-size:13pt;font-weight:700;line-height:1.4;margin:0 0 2mm}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm;border-top:.2mm solid var(--ink);border-bottom:.2mm solid var(--ink);padding:1.8mm 0 2mm;margin-bottom:1.8mm}
.pair b{display:flex;align-items:center;gap:2mm;font-family:"Pretendard",sans-serif;font-size:10.5pt;font-weight:800}
.pair b::before{content:'';width:4.6mm;height:4.6mm;border:.3mm solid var(--ink);border-radius:50%;background:#fff;flex:none}
.pair span{display:block;font-family:"Pretendard",sans-serif;font-size:8.8pt;line-height:1.4;margin-top:.8mm}
.wr{height:12mm;border-bottom:.25mm solid var(--ink2);display:flex;align-items:flex-end;font-size:12pt;color:var(--ink2);padding-bottom:1.2mm}
.big{flex:1;min-height:0;display:flex;flex-direction:column;padding:3.4mm 0 3mm;border-bottom:.25mm solid var(--rule)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:9mm}
.stage svg{display:block;flex:none}
.cap{display:flex;flex-direction:column;gap:1.2mm}
.cap span,.exb span{font-family:"Pretendard",sans-serif;font-size:8.4pt;font-weight:700;letter-spacing:.08em;color:var(--ink2)}

<body>
<div id="sheet"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search), want = /^\d{4}-\d{2}-\d{2}$/.test(q.get('d') || '') ? q.get('d') : '';
  const d = await (await fetch('news/' + (want || 'latest') + '.json', { cache: 'no-cache' })).json();
  if (q.get('ink') === '1') document.body.classList.add('ink');
  const X = d.paper || {};
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const body = t => esc(t).split(/\n+/).filter(Boolean).map(p => '<p>' + p.replace(/《(.+?)》/g, '<b>$1</b>') + '</p>').join('');
  const dt = new Date(d.date + 'T12:00'), days = '일월화수목금토';
  const dateTxt = `${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 ${days[dt.getDay()]}요일`;
  const fig = a => a.img ? `<figure><img src="${esc(a.img)}" alt=""><figcaption>그림 · ${esc(a.cap || '')}</figcaption></figure>` : '';
  const src = a => `<p class="src">출처 · ${esc(a.source)}</p>`;
  const [A, B, C] = [...d.articles].sort((a, b) => !a.img - !b.img);   // 그림 없는 기사는 2면 아래로 보낸다

  // ---- 놀이: 날짜를 씨앗으로 늘 같은 판이 나온다 ----
  let seed = [...d.date].reduce((s, c) => (s * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)], shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // 낱말 찾기 8×8: 가로(→)·세로(↓)로만. 빈칸은 흔한 글자로 채우되, 찾을 낱말이 우연히 한 번 더 생기지 않게 확인한다.
  const N = 8, FILL = '가나다라마바사아자차카타파하고노도로모보소오조초코토포호구누두루무부수우주추기니디리미비시이지치강산들꽃빛숲물불달별눈비'.split('');
  function wordSearch(words) {
    words = [...new Set(words.filter(w => w && w.length >= 2 && w.length <= N))].sort((a, b) => b.length - a.length).slice(0, 6);
    for (let tryN = 0; tryN < 2000; tryN++) {
      const g = Array.from({ length: N }, () => Array(N).fill('')), placed = [];
      let ok = true;
      for (const w of words) { let done = false;
        for (let t = 0; t < 300 && !done; t++) { const hz = rnd() < .5, r = Math.floor(rnd() * (hz ? N : N - w.length + 1)), c = Math.floor(rnd() * (hz ? N - w.length + 1 : N));
          let fit = true; for (let k = 0; k < w.length; k++) { const ch = g[r + (hz ? 0 : k)][c + (hz ? k : 0)]; if (ch && ch !== w[k]) { fit = false; break; } }
          if (fit) { for (let k = 0; k < w.length; k++) g[r + (hz ? 0 : k)][c + (hz ? k : 0)] = w[k]; placed.push({ w, r, c, hz }); done = true; } }
        if (!done) { ok = false; break; } }
      if (!ok) continue;
      const used = new Set(words.join(''));
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!g[r][c]) g[r][c] = pick(FILL.filter(x => !used.has(x)));
      const lines = []; for (let i = 0; i < N; i++) { lines.push(g[i].join('')); lines.push(g.map(row => row[i]).join('')); }
      const BAD = ['보지', '자지', '바보', '고자', '사고', '시비', '조지', '자살', '바지', '보초', '도주', '사기', '치사', '추하', '비리', '마비', '구타', '고추', '토하', '초상', '무시', '도마', '가시', '누구', '마누라'], both = lines.concat(lines.map(l => [...l].reverse().join('')));
      if (BAD.some(x => both.some(l => l.includes(x)))) continue;   // 채움 글자가 우연히 만든 어색한 말은 버리고 다시 짠다
      if (words.every(w => both.reduce((n, l) => n + l.split(w).length - 1, 0) === 1)) return { g, placed, words };
    }
    return null;
  }
  // 미로: 가로 cols × 세로 rows, 왼쪽 위 → 오른쪽 아래. 벽을 허무는 방식이라 길은 꼭 하나 있다.
  function maze(cols, rows) {
    const R = Array.from({ length: rows }, () => Array(cols).fill(0)), D = Array.from({ length: rows }, () => Array(cols).fill(0)), seen = Array.from({ length: rows }, () => Array(cols).fill(false));
    const st = [[0, 0]]; seen[0][0] = true;
    while (st.length) { const [r, c] = st[st.length - 1]; const nb = shuffle([[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]).filter(([a, b]) => a >= 0 && b >= 0 && a < rows && b < cols && !seen[a][b]);
      if (!nb.length) { st.pop(); continue; } const [a, b] = nb[0]; if (a === r) R[r][Math.min(c, b)] = 1; else D[Math.min(r, a)][c] = 1; seen[a][b] = true; st.push([a, b]); }
    const S = 10, W = cols * S, H = rows * S; let p = `M0 0H${W}V${H}H0Z`;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { if (c < cols - 1 && !R[r][c]) p += `M${(c + 1) * S} ${r * S}v${S}`; if (r < rows - 1 && !D[r][c]) p += `M${c * S} ${(r + 1) * S}h${S}`; }
    return `<svg viewBox="-1 -1 ${W + 2} ${H + 2}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="${W}" height="${H}" fill="#F6F0E2"/><rect x="0" y="0" width="${S}" height="${S}" fill="#F7D9A8"/><rect x="${W - S}" y="${H - S}" width="${S}" height="${S}" fill="#C9D3EF"/><path d="${p}" fill="none" stroke="#18254E" stroke-width="1.1" stroke-linecap="square"/><text x="${S / 2}" y="${S / 2 + 1.4}" font-size="3.6" font-family="Pretendard" font-weight="700" text-anchor="middle" fill="#8A4A10">출발</text><text x="${W - S / 2}" y="${H - S / 2 + 1.4}" font-size="3.6" font-family="Pretendard" font-weight="700" text-anchor="middle" fill="#18254E">도착</text></svg>`;
  }
  // 스도쿠 4×4: 답이 하나뿐인 판만 낸다.
  function sudoku() {
    const base = [[1, 2, 3, 4], [3, 4, 1, 2], [2, 1, 4, 3], [4, 3, 2, 1]], m = shuffle([1, 2, 3, 4]);
    let g = base.map(r => r.map(v => m[v - 1])); if (rnd() < .5) g = [g[1], g[0], g[2], g[3]]; if (rnd() < .5) g = [g[0], g[1], g[3], g[2]]; if (rnd() < .5) g = g.map(r => [r[1], r[0], r[2], r[3]]); if (rnd() < .5) g = [g[2], g[3], g[0], g[1]];
    const count = b => { for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!b[r][c]) { let n = 0; for (let v = 1; v <= 4 && n < 2; v++) { let ok = true; for (let k = 0; k < 4; k++) if (b[r][k] === v || b[k][c] === v) ok = false; const br = r - r % 2, bc = c - c % 2; for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) if (b[br + i][bc + j] === v) ok = false; if (ok) { b[r][c] = v; n += count(b); b[r][c] = 0; } } return n; } return 1; };
    const p = g.map(r => [...r]);
    for (const k of shuffle([...Array(16).keys()])) { const r = k >> 2, c = k & 3, v = p[r][c]; p[r][c] = 0; if (count(p.map(x => [...x])) !== 1 || p.flat().filter(Boolean).length < 6) p[r][c] = v; }
    return p;
  }

  // ===== 다른 그림 찾기: 선 그림 장면 묶음. 장면마다 '바뀔 수 있는 곳' 10군데 안팎을 미리 정해 두고, 날짜로 다섯 군데를 고른다. =====
  // 규칙: ① 차이는 색이 아니라 모양으로만 낸다(흑백으로 찍혀도 풀 수 있게) ② 고른 다섯 곳은 서로 SPOT_GAP 넘게 떨어진다 ③ 그린 뒤 두 그림을 실제로 비교해 확인한다(checkSpot).
  const K = '#18254E', st = w => `stroke="#18254E" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`, stt = w => st(w) + ' fill="none"', SW = st(1), SWT = stt(.6);
  const f1 = n => Math.round(n * 10) / 10;
  const tube = (d, w, col) => `<path d="${d}" fill="none" stroke="${K}" stroke-width="${w + 1.8}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const sparkle = (x, y, r, c = '#E9A23B') => `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${c}"/>`;
  const bubble = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity=".7" ${st(.7)}/><path d="M${f1(x - r * .45)} ${f1(y - r * .1)}A${f1(r * .5)} ${f1(r * .5)} 0 0 1 ${f1(x - r * .05)} ${f1(y - r * .5)}" ${stt(.5)}/>`;
  const kelp = (x, y, h, ph, col) => { let a = '', b = ''; const n = 14; for (let i = 0; i <= n; i++) { const t = i / n, cx = x + Math.sin(t * 5.2 + ph) * (2.2 + t * 3.2), cy = y - h * t, w = 2.6 * (1 - t * .75) + .3; a += `${i ? 'L' : 'M'}${f1(cx - w)} ${f1(cy)}`; b = `L${f1(cx + w)} ${f1(cy)}` + b; }
    let v = ''; for (let i = 0; i <= n; i++) { const t = i / n; v += `${i ? 'L' : 'M'}${f1(x + Math.sin(t * 5.2 + ph) * (2.2 + t * 3.2))} ${f1(y - h * t)}`; }
    return `<path d="${a}${b}Z" fill="${col}" ${st(.8)}/><path d="${v}" ${stt(.4)}/>`; };
  const fish = (x, y, s, dir, col) => `<g transform="translate(${x} ${y}) scale(${s * dir} ${s})"><path d="M5.500 0l4.500 -3.200q-1.200 3.200 0 6.400Z" fill="${col}" ${st(f1(.8 / s))}/><path d="M-6.500 0Q-1 -5 6 0Q-1 5 -6.500 0Z" fill="${col}" ${st(f1(.8 / s))}/><path d="M-2.500 -2.500q1.600 2.500 0 5M1 -1.200l2 1.200l-2 1.200" ${stt(f1(.5 / s))}/><circle cx="-4.200" cy="-.5" r=".6" fill="${K}"/></g>`;
  const crater = (x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#C4C9D6" ${st(.8)}/><path d="M${f1(x - rx * .7)} ${f1(y + ry * .1)}Q${x} ${f1(y + ry * 1.1)} ${f1(x + rx * .7)} ${f1(y + ry * .1)}" ${stt(.5)}/>`;

  const SCENES = {
    // ---- 깊은 바다 ----
    sea: { name: '깊은 바다', count: 30,
      diffs: [[41, 46], [135, 17], [92, 24], [70, 59], [112, 71], [170, 79], [74, 113], [142, 109], [33, 107], [60, 88]],
      draw(on) {
        let o = `<rect x="0" y="0" width="200" height="124" fill="#E3EAF8"/><path d="M52 0L18 124H58L86 0Z" fill="#fff" opacity=".42"/><path d="M118 0L124 124H160L140 0Z" fill="#fff" opacity=".34"/>`;
        // 먼 산등성이와 먼 고래
        o += `<path d="M0 90Q26 70 52 84T104 80T156 72T200 82V110H0Z" fill="#D3DCF2"/>`;
        // 바다눈(가라앉는 알갱이)
        [[12, 12], [20, 58], [58, 26], [64, 8], [78, 74], [96, 44], [108, 60], [130, 38], [128, 80], [150, 12], [176, 60], [190, 34], [188, 8], [46, 70], [92, 6], [162, 4]].forEach(([x, y]) => o += `<circle cx="${x}" cy="${y}" r=".7" fill="#fff"/>`);
        // 뒤쪽 미역
        o += kelp(5, 100, 74, 0, '#B9C6EC') + kelp(36, 100, 50, 2, '#C9D3EF') + kelp(26, 98, 34, 4, '#B9C6EC') + kelp(196, 100, 44, 1, '#B9C6EC') + kelp(189, 98, 30, 3, '#C9D3EF');
        // 왼쪽 바위와 산호
        o += `<path d="M-2 106V83Q6 76 15 80Q23 77 30 86Q40 89 41 106Z" fill="#DADDE6" ${SW}/><path d="M8 84l3 5M22 86l-2 6l4 4M32 92l-3 4" ${SWT}/>`;
        o += tube('M15 81V64M15 73Q9 71 8 63M15 69Q21 67 22 59M15 64Q13 58 16 54M8 63Q5 61 5 57M22 59Q25 57 24 53', 2, '#EDB38C');
        // 오른쪽 바위
        o += `<path d="M144 106Q146 91 158 90Q176 85 191 91Q202 96 202 106Z" fill="#DADDE6" ${SW}/><path d="M150 97l4 3M190 95l-3 4" ${SWT}/>`;
        // 바닥
        o += `<path d="M-2 102Q20 96 44 101T96 103T150 99T202 102V126H-2Z" fill="#F4E6C6" ${SW}/>`;
        o += `<path d="M6 118q6 -2 12 0M40 120q7 -2 14 0M86 118q6 -2 12 0M112 112q5 -1.500 10 0M156 118q7 -2 14 0M178 110q5 -1.500 10 0M96 108q4 -1 8 0" ${SWT}/>`;

  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ['', 'ㄱ', 'ㄲ', null, 'ㄴ', null, null, 'ㄷ', 'ㄹ', null, null, null, null, null, null, null, 'ㅁ', 'ㅂ', null, 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

  // ---- 무늬 잇기 ----
  function gamePattern() { const T = shuffle(['AB', 'AAB', 'ABB', 'ABC', 'ABAC']).slice(0, 3), gs = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 10, 12, 13, 17, 18]), rows = []; let bad = '';

  // ---- 스도쿠 4×4 두 판(답이 하나뿐인 판만) ----
  function gameSudoku() { const one = () => { const p = sudoku(), S = 12; let o = `<rect width="48" height="48" fill="${CREAM}"/>`;

  // ---- 낱말 찾기 8×8·6개 ----
  function gameWs() { return { title: '낱말 찾기', say: `오늘 신문의 낱말 ${ws ? ws.words.length : ''}개가 가로나 세로로 숨어 있어요.`, bad: ws ? '' : '낱말 찾기 실패',

  // ===== 4라운드: 놀이 22종. 큰 놀이 12 + 작은 놀이 10. 기사 그림을 그대로 쓰는 놀이(조각 맞추기·확대경)가 먼저다. =====
  const ws = wordSearch([...(X.find || []), ...d.articles.map(a => a.word && a.word.w)]);

  // ---- 조각 맞추기: 기사 그림을 잘라 섞는다. 밋밋한 조각이 둘 넘거나 서로 닮은 조각이 있으면 다른 그림으로, 다 안 되면 다른 놀이로. ----
  async function gameJigsaw(cols, rows) { let why = '';

  }
  // ---- 확대경: 그림의 네 곳을 크게 보여 주고 어느 칸인지 적는다. 무늬가 없는 곳·서로 닮은 곳은 고르지 않는다. ----

    return { fallback: '확대경 대체:' + why };
  }

  // ---- 반쪽 그리기: 알아볼 수 있는 모양 14가지(왼쪽 반의 꼭짓점: [가운데 금에서 떨어진 칸 수, 줄]) ----

  const countLines = (el, html, u) => { el.style.height = 'auto'; el.innerHTML = `<div class="flow">${html}</div>`; return Math.round(toMm(el.firstChild.getBoundingClientRect().height) / u); };
  const cropH = (m, h) => { $('.crop', m).style.height = h.toFixed(3) + 'mm'; };

  { // 1면 머리기사: 그림(온 너비) 아래 두 단. 둘째 단 끝에 출처 한 줄과 '오늘의 숫자' 상자.
    const m = $('#mA'), cols = $$('.colv', m), html = body(A.body), W = toMm(m.clientWidth), avail = toMm(m.clientHeight - $('.mh', m).offsetHeight) - CAP - PT;
    let best = null;
    for (const [fs, u] of [[11.5, 6.7], [11.8, 6.9], [12, 7.1], [12.3, 7.3], [12.6, 7.5]]) {
      m.style.setProperty('--u', u + 'mm'); m.style.setProperty('--fs', fs + 'pt');
      const Tn = countLines(cols[0], html, u), nb = A.num ? Math.ceil(25 / u) : 0, k = Math.ceil((Tn + nb + 1) / 2), ph = avail - k * u, sc = Math.abs(W / ph - 1.6);
      if (ph > 30 && (!best || sc < best.sc)) best = { fs, u, Tn, nb, k, ph, sc };
    }
    if (!best) bad.push('1면 머리기사가 넘쳐요'); else { const { fs, u, Tn, nb, k, ph } = best;
      m.style.setProperty('--u', u + 'mm'); m.style.setProperty('--fs', fs + 'pt'); cropH(m, ph);
      const n2 = A.num ? Math.max(0, Tn - k) : k - 1; setCol(cols[0], html, 0, k, u); setCol(cols[1], html, k, n2, u);
      if (A.num) $('.num', m).style.height = ((k - n2 - 1) * u) + 'mm';
      if (W / ph > 2.05 || W / ph < 1.3) warn.push('1면 그림 비율 ' + (W / ph).toFixed(2));
      document.body.dataset.fit1 = JSON.stringify({ fs, u, lines: Tn, k, pic: Math.round(ph), ratio: +(W / ph).toFixed(2) }); }
  }
  { // 2면: 위 기사는 그림이 오른쪽 두 단, 아래 기사는 그림이 왼쪽 한 단. 글자 크기·두 기사의 높이 나눔·그림 높이를 함께 고른다.
    const box = $('.p2'), mB = $('#mB'), mC = $('#mC'), SEP = 7.5, H = toMm(box.clientHeight), hB = toMm($('.mh', mB).offsetHeight), hC = toMm($('.mh', mC).offsetHeight);
    const cB = $$('.colv', mB), cC = $$('.colv', mC), hb = body(B.body), hc = body(C.body), W1 = toMm(cB[0].clientWidth), W2 = W1 * 2 + 5;
    const font = (fs, u) => { box.style.setProperty('--u', u + 'mm'); box.style.setProperty('--fs', fs + 'pt'); };
    let best = null;
    for (const [fs, u] of [[11, 6.2], [11.5, 6.5], [12, 6.8], [12.4, 7.1], [12.8, 7.4], [13.2, 7.7]]) { font(fs, u);
      const TB = countLines(cB[0], hb, u), TC = countLines(cC[0], hc, u);
      for (let nB = 8; nB < TB; nB++) {
        const nC = Math.floor((H - hB - hC - SEP - nB * u) / u); if (nC < 6) continue;
        const kB = Math.max(0, Math.ceil((TB + 1 - nB) / 2)), pB = (nB - kB) * u - CAP - PT, kC = C.img ? TC - (2 * nC - 1) : nC, pC = C.img ? (nC - kC) * u - CAP - PT : W1 / 1.45;
        if (!C.img && (3 * nC - 1 < TC || 3 * nC - 1 > TC + 2)) continue;   // 그림이 없으면 세 단이 글로 꼭 찬다
        if (kB < 3 || kC < 0 || (kC > 0 && kC < 3) || pB < 30 || pC < 24) continue;
        const rB = W2 / pB, rC = W1 / pC, sc = (rB - 1.62) ** 2 + (rC - 1.45) ** 2 + .04 * (nB + 2 * kB - 1 - TB);
        if (!best || sc < best.sc) best = { fs, u, TB, TC, nB, nC, kB, kC, pB, pC, rB, rC, sc };
      } }
    if (!best) bad.push('2면 글이 격자에 맞지 않아요'); else { const { fs, u, nB, nC, kB, kC, pB, pC, rB, rC } = best; font(fs, u);
      cropH(mB, pB); setCol(cB[0], hb, 0, nB, u); setCol(cB[1], hb, nB, kB, u); setCol(cB[2], hb, nB + kB, kB - 1, u);
      if (C.img) cropH(mC, pC); setCol(cC[0], hc, 0, kC, u); setCol(cC[1], hc, kC, nC, u); setCol(cC[2], hc, kC + nC, nC - 1, u);
      const left = H - hB - hC - SEP - (nB + nC) * u, sep = $('.sep', box); sep.style.margin = `${(3.2 + left * .45).toFixed(2)}mm 0 ${(SEP - 3.45 + left * .15).toFixed(2)}mm`; box.style.paddingBottom = (left * .4).toFixed(2) + 'mm';
      if (rB > 2.1 || rB < 1.3 || rC > 2 || rC < 1.2) warn.push('2면 그림 비율 ' + rB.toFixed(2) + '/' + rC.toFixed(2));
      document.body.dataset.fit2 = JSON.stringify({ ...best, H: Math.round(H) }); }
  }
  // 넘침 확인(인쇄 파일 만들 때 본다): 쪽 안의 내용이 종이 밖으로 나가면 표시. 조판이 실패하면 까닭도 붙인다.
  document.body.dataset.over = [...document.querySelectorAll('.page')].map(p => { const f = p.querySelector('.foot').getBoundingClientRect(), r = p.getBoundingClientRect(); return Math.round(f.bottom - r.bottom); }).join(',') + (bad.length ? ' !' + bad.join(' / ') : '');
  document.body.dataset.games = [GB.spot ? await checkSpot(SP).catch(e => 'spot 검사 실패 ' + e) : '', GB.bad, ...GSS.map(G => G.bad), schedBad, ...[...document.querySelectorAll('.big,.small,.stage')].filter(e => e.scrollHeight > e.clientHeight + 2 || e.scrollWidth > e.clientWidth + 2).map(e => '놀이 칸 넘침 ' + e.className), ...bad].filter(Boolean).join(' / ') || 'ok';
  document.body.dataset.pick = `${bigKey}+${smallKeys.join(',')} ${genMs}ms`; document.body.dataset.notes = notes.join(' / ');
  document.body.dataset.warn = warn.join(' / ');
  document.body.dataset.ready = '1';
})();
