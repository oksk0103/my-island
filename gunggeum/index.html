<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18231F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>궁금칸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: editorial signboard for a 15.6" DeX monitor. Three rows: slim top bar / the answer in big type, centered vertically / question bar. Warm off-white, ink, one terracotta accent; squared corners throughout. Dark theme = chalkboard green with amber type and a faint grid. */
:root {
  --bg: #F7F6F1; --surface: #EEECE4; --ink: #1C211E; --muted: #777970; --line: #D8D6CE;
  --accent: #B65332; --accent-ink: #FFFAF4; --grid: transparent;
  --f-display: "Do Hyeon", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18231F; --surface: #202E29; --ink: #EFB65F; --muted: #9B9E8F; --line: #435049;
    --accent: #E6A44B; --accent-ink: #18231F; --grid: rgba(238, 182, 95, .035); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18231F; --surface: #202E29; --ink: #EFB65F; --muted: #9B9E8F; --line: #435049;
  --accent: #E6A44B; --accent-ink: #18231F; --grid: rgba(238, 182, 95, .035); color-scheme: dark;
}
html, body { height: 100%; }
@media (min-width: 1100px) { html { font-size: 20px; } }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 1rem; line-height: 1.4;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 38px 38px;
}
html, body { touch-action: pan-y; overscroll-behavior: none; }
.app { touch-action: pan-y; } .log { touch-action: pan-y; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app {
  height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.inner { width: 100%; max-width: 1640px; margin: 0 auto; }

/* top bar */
.topbar { border-bottom: 1px solid var(--line); }
.topbar .inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 3.6rem; gap: 1rem; }
.wordmark { justify-self: start; font-family: var(--f-display); font-size: 1.35rem; letter-spacing: -.02em; color: var(--ink); background: none; border: 0; padding: .4rem 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.wordmark .eye { width: .5em; height: .5em; margin-left: .18em; vertical-align: top; margin-top: .05em; }
.status { display: inline-flex; align-items: center; gap: .6rem; min-height: 2.4rem; color: var(--muted); font-size: .9rem; font-weight: 600; white-space: nowrap; }
.app[data-state="listen"] .status, .app[data-state="think"] .status, .app[data-state="quiz"] .status { color: var(--accent); }
.app[data-state="answer"] .status { color: var(--ink); }
/* 궁금이 (mascot) — parts shown per state */
.gk { width: 2.3rem; height: 2.2rem; overflow: visible; flex: none; }
.gk * { transform-box: fill-box; transform-origin: center; }
.gk .gk-body { transform-box: view-box; transform-origin: 50px 90px; }
.gk .st { display: none; }
.app[data-state="listen"] .gk .st-listen, .app[data-state="think"] .gk .st-think, .app[data-state="answer"] .gk .st-answer, .app[data-state="quiz"] .gk .st-quiz, .app.clock-mode .gk .st-sleep { display: inline; }
.app.clock-mode .gk .gk-eye { display: none; animation: none; }
.app.clock-mode .gk .gk-body { transform: rotate(6deg); }
@keyframes gk-zz { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
.gk .gk-z { animation: gk-zz 4s ease-in-out infinite; } .gk .gk-z:nth-of-type(2) { animation-delay: .9s; }
.app[data-state="listen"] .gk .gk-eye { transform: scale(1.18); }
.app[data-state="think"] .gk .gk-pupil { transform: translate(2.6px, -3.2px); }
.app[data-state="quiz"] .gk .gk-pupil { transform: translate(-.8px, .4px); }
@keyframes gk-blink { 0%, 82%, 100% { transform: scaleY(1); } 89% { transform: scaleY(.1); } }
.app[data-state="idle"] .gk .gk-eye { animation: gk-blink 3.2s ease-in-out infinite; }
@keyframes gk-tilt { 0%, 100% { transform: rotate(4deg) scale(1.03); } 50% { transform: rotate(7deg) scale(1.05); } }
.app[data-state="listen"] .gk .gk-body { animation: gk-tilt 1s ease-in-out infinite; }
@keyframes gk-bar { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
.gk .gk-bar { animation: gk-bar .8s ease-in-out infinite; } .gk .gk-bar:nth-child(2) { animation-delay: .12s; } .gk .gk-bar:nth-child(3) { animation-delay: .24s; }
@keyframes gk-dot { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
.gk .gk-dot { animation: gk-dot 1.2s ease-in-out infinite; } .gk .gk-dot:nth-child(2) { animation-delay: .2s; } .gk .gk-dot:nth-child(3) { animation-delay: .4s; }
@keyframes gk-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-8px) scale(.97, 1.03); } 55% { transform: translateY(0) scale(1.04, .95); } 70% { transform: translateY(0) scale(1, 1); } }
.app[data-state="answer"] .gk .gk-body { animation: gk-hop .9s cubic-bezier(.23, 1, .32, 1) 2; }
@keyframes gk-brow { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2.5px) rotate(-4deg); } }
.app[data-state="quiz"] .gk .gk-brow { animation: gk-brow 1.1s ease-in-out infinite; }
@keyframes gk-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.app[data-state="quiz"] .gk .gk-body { animation: gk-sway 1.1s ease-in-out infinite; }
/* listening wave inside the input */
.wave { display: none; width: 1.5rem; height: 1.2rem; }
.wave rect { transform-box: fill-box; transform-origin: center; animation: gk-wave .9s ease-in-out infinite; }
.wave rect:nth-child(2) { animation-delay: .12s; animation-duration: .75s; } .wave rect:nth-child(3) { animation-delay: .24s; animation-duration: .85s; } .wave rect:nth-child(4) { animation-delay: .08s; animation-duration: .7s; } .wave rect:nth-child(5) { animation-delay: .2s; animation-duration: .8s; }
@keyframes gk-wave { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
.app[data-state="listen"] .mic .micico { display: none; } .app[data-state="listen"] .mic .wave { display: block; }
/* key phrase — 형광펜 (낮: 머스터드 / 밤: 테라코타 밴드 + 크림 글자) */
:root { --hl: #F3D36B; --hl-ink: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hl: #7A3A20; --hl-ink: #FFF1D6; } }
:root[data-theme="dark"] { --hl: #7A3A20; --hl-ink: #FFF1D6; }
.sheet .key { text-decoration: none; }
.sheet .key .w { border-bottom: 0; color: var(--hl-ink); background: linear-gradient(transparent 12%, var(--hl) 12%, var(--hl) 90%, transparent 90%); padding: 0 .06em; margin: 0 -.06em; }
.sheet .key svg { display: none; }
/* constellation */
.dots svg { width: 4.6rem; height: 2rem; overflow: visible; }
@keyframes gk-twinkle { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.dots .tw { animation: gk-twinkle 1.2s ease-in-out infinite; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 1.1rem; }
.iconbtn { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border: 0; background: none; color: var(--muted); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.iconbtn.gear { opacity: .45; } .iconbtn.gear:active { opacity: 1; }
.pin { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; }
.pin[hidden] { display: none; }
.pin .box { display: flex; flex-direction: column; gap: .9rem; align-items: center; padding: 2rem 2.4rem; border: 1px solid var(--line); background: var(--bg); }
.pin h3 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; color: var(--ink); }
.pin input { font: inherit; font-size: 1.6rem; letter-spacing: .5em; text-align: center; width: 8em; padding: .4rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.pin .row { display: flex; gap: .6rem; } .pin .note { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
.iconbtn svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.count { display: flex; align-items: center; gap: .7rem; color: var(--muted); font-size: .85rem; white-space: nowrap; }
.count b { color: var(--ink); font-weight: 700; }
.dots { display: flex; gap: .3rem; }
.dots i { width: .3rem; height: .3rem; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* main */
.main .inner { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; padding-block: 1.2rem; min-height: 0; }
.eyebrow { margin: 0; color: var(--muted); font-size: .95rem; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: center; gap: .6rem; min-height: 1.4em; overflow-wrap: anywhere; }
.eyebrow .dash { width: 1.4rem; height: 2px; background: var(--accent); flex: none; }
.eyebrow .sep { color: var(--line); }
.sheet {
  --fs: 64px; margin: 0; font-family: var(--f-display); font-weight: 400; font-size: var(--fs); line-height: 1.22; letter-spacing: -.03em;
  word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty; max-width: 1570px; color: var(--ink);
}
.sheet.soft { color: var(--muted); }
.sheet .w { display: inline-block; border-bottom: 2px dotted color-mix(in srgb, var(--ink) 28%, transparent); padding-bottom: .02em; cursor: pointer; transition: color .15s, border-color .15s; }
.sheet .w.sel, .sheet .w:active { color: var(--accent); border-bottom: 2px solid var(--accent); }
.sheet.soft .w, .sheet.plain .w { border-bottom: 0; cursor: default; }
.sheet .ch { display: inline-block; }
.sheet .ch.on { animation: ink .18s ease-out both; }
@keyframes ink { from { transform: translateY(.12em); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet .ch.on, .gk *, .wave rect, .dots .tw { animation: none !important; } }
.meta { display: flex; align-items: center; gap: 1.4rem; color: var(--muted); font-size: .9rem; min-height: 2.2rem; flex-wrap: wrap; }
.meta .textbtn { display: inline-flex; align-items: center; gap: .45rem; min-height: 2.2rem; padding: 0; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .9rem; }
.meta .textbtn:active { color: var(--accent); }
.meta .textbtn svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; min-height: 2.8rem; }
.chips .lbl { color: var(--muted); font-size: .8rem; font-weight: 600; margin-right: .2rem; }
.chips button { min-height: 2.8rem; padding: 0 1.2rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font-size: .95rem; font-weight: 600; white-space: nowrap; }
.chips button:active { border-color: var(--accent); color: var(--accent); }
.chips button.lead { border: 1px solid var(--accent); border-radius: 0; min-height: 3.2rem; padding: 0 1.3rem; font-size: 1rem; }
.chips button.lead span { color: var(--accent); padding-left: 1.2rem; }

/* picture column */
.textcol { display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
.main .inner.has-fig { display: grid; grid-template-columns: minmax(0, 1fr) clamp(13rem, 28%, 24rem); gap: 2.4rem; align-items: center; }
.fig { margin: 0; display: flex; flex-direction: column; gap: .6rem; min-width: 0; animation: figin .5s cubic-bezier(.23, 1, .32, 1) both; }
@keyframes figin { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
.fig-box { position: relative; aspect-ratio: 1 / 1; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, var(--line)); overflow: hidden; display: grid; place-items: center; }
.fig-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fig-box .emo { font-size: clamp(2.4rem, 5vw, 4.6rem); line-height: 1.15; letter-spacing: .1em; text-align: center; padding: .5rem; white-space: nowrap; }
.fig figcaption { color: var(--muted); font-size: .8rem; display: flex; justify-content: space-between; gap: .5rem; }
.fig figcaption b { color: var(--ink); font-weight: 600; }
.fig figcaption:empty { display: none; }

/* special screens: clock / weather (Magic Patterns 시안 기준) */
.main .inner.special-on .textcol, .main .inner.special-on .fig { display: none; }
.special { display: grid; grid-template-columns: max-content 1px minmax(22rem, 36rem); justify-content: center; column-gap: 4.5rem; align-items: stretch; min-height: 0; height: 100%; }
.special[hidden] { display: none; }
.special > .sp-rule { background: var(--line); margin: 3.6rem 0; }
.sp-clock, .sp-wx { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.sp-time { font-family: var(--f-display); font-size: clamp(5rem, 13.2vw, 12.6rem); line-height: .86; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--ink); margin-left: -.03em; }
.sp-date { margin-top: 1.5rem; font-size: 1.3rem; font-weight: 500; color: var(--muted); }
.sp-msg { margin-top: .7rem; font-size: 1.1rem; font-weight: 500; color: var(--accent); }
.sp-label { font-size: .8rem; font-weight: 500; color: var(--muted); }
.sp-wx-main { display: flex; align-items: center; gap: 1.1rem; margin-top: .9rem; }
.sp-wx-ico { display: inline-flex; flex: none; width: 5.2rem; height: 5.2rem; color: var(--accent); }
.sp-wx-ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
.sp-wx-temp { font-family: var(--f-display); font-size: 6.4rem; line-height: .9; color: var(--ink); }
.sp-wx-txt { margin-top: .7rem; font-family: var(--f-display); font-size: 1.7rem; color: var(--ink); }
.sp-wx-row { margin-top: .7rem; font-size: .78rem; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; }
.sp-wx-row span { white-space: nowrap; } .sp-wx-row span + span::before { content: '·'; padding: 0 .55em; }
.sp-hourly { display: grid; grid-template-columns: repeat(6, 1fr); gap: .4rem; margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.sp-hourly .h { display: flex; flex-direction: column; align-items: center; gap: .25rem; min-width: 0; }
.sp-hourly .h-t { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.sp-hourly .h-i { width: 1.9rem; height: 1.9rem; color: var(--accent); } .sp-hourly .h-i svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sp-hourly .h-p { font-size: .68rem; color: var(--muted); } .sp-hourly .h-p.wet { color: var(--accent); font-weight: 700; }
.sp-hourly .h-d { font-family: var(--f-display); font-size: 1.15rem; color: var(--ink); line-height: 1; }
.sp-wx-tip { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--line); font-size: 1.1rem; font-weight: 700; color: var(--accent); }
/* morning: weather is the hero, time secondary */
.special.morning { grid-template-columns: max-content 1px minmax(26rem, 44rem); }
.special.morning .sp-time { font-size: clamp(3.4rem, 6vw, 5.6rem); line-height: .9; }
.special.morning .sp-date { margin-top: .9rem; font-size: 1rem; }
.special.morning .sp-msg { margin-top: 1.8rem; font-size: 1.1rem; color: var(--ink); line-height: 1.55; }
.special.morning .sp-wx-ico { width: 8.4rem; height: 8.4rem; } .special.morning .sp-wx-ico svg { stroke-width: 1.4; }
.special.morning .sp-wx-temp { font-size: 10.4rem; line-height: .85; }
.special.morning .sp-wx-main { gap: 1.4rem; margin-top: .5rem; }
.special.morning .sp-wx-cond { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; margin-top: .7rem; }
.special.morning .sp-wx-txt { margin-top: 0; font-size: 2.2rem; } .special.morning .sp-wx-row { margin-top: 0; font-size: .8rem; }
.special.morning .sp-wx-tip { font-size: 1.2rem; }
.special.morning .sp-hourly { grid-template-columns: repeat(8, 1fr); }
/* night: low-glare */
.app.clock-mode .sp-time, .app.clock-mode .sp-wx-temp, .app.clock-mode .sp-wx-txt { color: color-mix(in srgb, var(--ink) 86%, transparent); }
.app.clock-mode .qbar, .app.clock-mode .foot { visibility: hidden; }
@media (max-width: 900px) {
  .special, .special.morning { grid-template-columns: 1fr; height: auto; }
  .special > .sp-rule { margin: 1.6rem 0; height: 1px; }
  .sp-clock, .sp-wx { padding: 0; }
  .special.morning .sp-clock { order: 2; }
  .sp-time { font-size: clamp(4.5rem, 30vw, 7rem); } .special.morning .sp-time { font-size: 3.2rem; }
  .special.morning .sp-wx-temp { font-size: 6.5rem; } .special.morning .sp-wx-ico { width: 5.6rem; height: 5.6rem; }
  .special.morning .sp-hourly { grid-template-columns: repeat(6, 1fr); }
}

/* question bar */
.qbar .inner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(9rem, 10.5rem); gap: .7rem; padding-block: .6rem 1rem; }
.qbox { display: flex; align-items: center; min-height: 4rem; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 75%, transparent); transition: border-color .15s; }
.qbox:focus-within, .app[data-state="listen"] .qbox { border-color: var(--accent); }
.mic { display: grid; place-items: center; width: 3.6rem; height: 3.6rem; flex: none; border: 0; background: none; color: var(--accent); }
.mic svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#q { flex: 1; min-width: 0; height: 3.6rem; padding: 0 1.2rem 0 .1rem; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 1.05rem; }
#q::placeholder { color: var(--muted); opacity: .85; }
#askBtn { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4rem; padding: 0 1.3rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-size: 1.05rem; font-weight: 700; }
#askBtn span { font-size: 1.3rem; font-weight: 400; }
#askBtn:disabled { opacity: .5; cursor: default; }

/* footer */
.foot .inner { display: flex; align-items: center; justify-content: center; gap: .5rem; color: var(--muted); font-size: .75rem; padding-bottom: .7rem; }
.foot i { width: .3rem; height: .3rem; border-radius: 50%; background: var(--accent); }
.foot b { color: var(--line); font-weight: 400; }

@media (max-width: 760px) {
  .app { height: auto; min-height: 100%; grid-template-rows: auto auto auto auto; }
  .main .inner { height: auto; }
  .qbar { position: sticky; bottom: 0; background: var(--bg); padding-top: .4rem; }
  .topbar .inner { grid-template-columns: auto 1fr auto; min-height: 3.2rem; }
  .status { justify-self: center; padding: 0 .5rem; font-size: .8rem; }
  .count { display: none; }
  .main .inner { justify-content: flex-start; padding-block: 1.4rem 1rem; }
  .main .inner.has-fig { grid-template-columns: 1fr; gap: 1rem; }
  .fig { flex-direction: row; align-items: flex-end; gap: .8rem; }
  .fig-box { width: 9rem; flex: none; }
  .fig-box .emo { font-size: 2.6rem; }
  .meta { justify-content: space-between; gap: .6rem; }
  .chips { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .chips .lbl { display: none; }
  .qbar .inner { grid-template-columns: 1fr; gap: .6rem; }
  .qbox, #askBtn { min-height: 3.4rem; }
  .mic, #q { height: 3.2rem; }
  #askBtn { justify-content: center; }
  .foot .inner { font-size: .65rem; }
}

/* parent panel */
.log { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  // 날씨 지역 찾기
  $('wxFind').addEventListener('click', async () => {
    const q = $('wxName').value.trim(); if (!q) return;
    $('wxNote').textContent = '찾는 중…';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ko&format=json`).then(x => x.json());
      const g = r.results?.[0]; if (!g) { $('wxNote').textContent = '못 찾았어요. 구·시 이름으로 적어 보세요'; return; }
      saveSettings({ wxName: g.name, wxLat: g.latitude, wxLon: g.longitude }); wxCache = null;
    } catch (e) { $('wxNote').textContent = '연결이 안 돼요'; }
  });
  function touchIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!busy && !listening && document.activeElement !== input) showPiece(true); }, IDLE_MS); }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, touchIdle, true));

  input.addEventListener('focus', () => { if (!busy && !listening) setState('listen', '입력 중', '글자로 써도 돼. 다 쓰면 물어보기.'); });
  input.addEventListener('blur', () => { if (!busy && !listening && app.dataset.state === 'listen') setState(recent.length ? (quiz ? 'quiz' : 'answer') : 'idle', recent.length ? (quiz ? '퀴즈 중' : '답') : '쉬는 중', '마이크를 누르고 말해 봐.'); });

  // ---------- remote keys ----------
  const REPLAY_KEYS = ['F2', 'PageUp', 'ArrowLeft', 'ArrowUp'];
  const CLEAR_KEYS = ['F4', 'PageDown', 'Delete', 'MediaPlayPause', 'ArrowDown'];
  const ASK_KEYS = ['Enter', 'ArrowRight', ' '];
  const ROLE = k => ASK_KEYS.includes(k) ? '물어보기(말하기)' : REPLAY_KEYS.includes(k) ? '다시 듣기' : CLEAR_KEYS.includes(k) ? '지우기/멈추기' : '궁금칸에서 안 쓰는 키';
  const pinEl = $('pin'), pinInput = $('pinInput');
  document.addEventListener('keydown', e => {
    if (!pinEl.hidden) return; // 비밀번호 창에서는 키를 가로채지 않음
    if (!logEl.hidden) {
      if (['Enter', ' '].includes(e.key) && document.activeElement && ['BUTTON', 'INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
      e.preventDefault(); keyTest.textContent = `받은 키: ${e.key === ' ' ? 'Space' : e.key} → ${ROLE(e.key)}`; return;
    }
    if (e.isComposing) return;
    if (REPLAY_KEYS.includes(e.key)) { e.preventDefault(); if (e.repeat) return; speak(current, true); statusEl.textContent = '한 번 더 읽어 줄게.'; return; }
    if (CLEAR_KEYS.includes(e.key)) {
      e.preventDefault(); if (e.repeat) return;
      if (listening) { heard = ''; input.value = ''; stopListening(); return; }
      if (busy) { ctl?.abort(); return; }
      input.value = ''; statusEl.textContent = '지웠어. 다시 말해 봐.'; return;
    }
    if (ASK_KEYS.includes(e.key)) {
      if (e.repeat) { e.preventDefault(); return; }
      if (document.activeElement === input) { if (e.key === 'Enter') return; if (e.key === ' ') return; e.preventDefault(); if (input.value.trim()) ask(input.value); return; }
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      if (listening) { stopListening(); return; }   // second press: stop early and ask
      if (input.value.trim() && !busy) { ask(input.value); return; }
      startListening();
    }
  });
  document.addEventListener('wheel', () => { if (!logEl.hidden) keyTest.textContent = '받은 신호: 화면 스크롤 (궁금칸에서 안 씀)'; }, { passive: true });
  form.addEventListener('submit', e => { e.preventDefault(); if (!input.value.trim()) { startListening(); return; } ask(input.value); });

  // ---------- Claude API ----------
  async function claude(messages, { system, maxTokens = 1000, signal } = {}) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal,
      headers: { 'content-type': 'application/json', 'x-api-key': settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: settings.model || DEFAULTS.model, max_tokens: maxTokens, thinking: { type: 'between_tools' }, system, messages })
    });
    if (!res.ok) { const err = new Error('api'); err.status = res.status; try { err.detail = (await res.json()).error?.message; } catch (e) {} throw err; }
    const data = await res.json();
    const out = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('').trim();
    if (!out) throw Object.assign(new Error('empty'), { status: 0, detail: '빈 응답 (stop: ' + data.stop_reason + ', content: ' + JSON.stringify(data.content || []).slice(0, 120) + ')' });
    return out;
  }

  // ---------- picture (wikipedia photo → emoji → none) ----------
  const fig = $('fig'), figBox = $('figBox'), figCap = $('figCap'), mainInner = $('mainInner');
  let picSeq = 0;
  let lastRaw = '';
  function splitPic(raw) {
    // "@@ 검색어 | 이모지 | 질문1; 질문2" 줄을 어디에 있든 찾아서 떼어 낸다
    const lines = raw.split('\n');
    let i = lines.findIndex(l => /^\s*@@/.test(l)), tag, body;
    if (i >= 0) { tag = lines[i].replace(/^\s*@@\s*/, ''); lines.splice(i, 1); body = lines.join('\n').trim(); }
    else {
      const m = raw.match(/\s*@@\s*([^\n]*)\s*$/);
      if (!m || m.index === 0) return { body: raw, term: '', emoji: '', qs: [] };
      tag = m[1]; body = raw.slice(0, m.index).trim();
    }
    const [t = '', e = '', q = ''] = tag.split('|');
    const qs = q.split(/[;；\n]/).map(x => x.trim().replace(/^[-·•\d.\s]+/, '')).filter(x => x.length >= 2 && x.length <= 24).slice(0, 4);
    return { body: body || raw.replace(/@@[^\n]*/g, '').trim(), term: cleanTerm(t), emoji: pickEmoji(e), qs };
  }
  const cleanTerm = t => (t || '').trim().replace(/^[\s"'「」]+|[\s"'「」]+$/g, '');
  const pickEmoji = e => Array.from((e || '').matchAll(/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu), x => x[0]).slice(0, 3).join('');
  function hidePic() { picSeq++; fig.hidden = true; mainInner.classList.remove('has-fig'); figBox.innerHTML = ''; figCap.textContent = ''; fit(); }
  function placePic(html, cap) {
    figBox.innerHTML = html; figCap.innerHTML = cap || '';
    fig.hidden = false; mainInner.classList.add('has-fig'); fig.style.animation = 'none'; void fig.offsetWidth; fig.style.animation = '';
    fit();
  }
  async function wikiImage(term, signal) {
    const u = 'https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&gsrnamespace=0&prop=pageimages&piprop=thumbnail|name&pithumbsize=900&gsrsearch=' + encodeURIComponent(term);
    const res = await fetch(u, { signal }); if (!res.ok) return null;
    const pages = Object.values((await res.json()).query?.pages || {}).sort((a, b) => a.index - b.index);
    const p = pages.find(x => x.thumbnail && !/\.svg$/i.test(x.pageimage || '') && !/map|flag|icon|logo/i.test(x.pageimage || ''));
    return p ? { src: p.thumbnail.source, title: p.title } : null;
  }
  const picDbg = m => { try { const el = $('picDbg'); if (el) el.textContent = '마지막 그림: ' + m + (lastRaw ? ' ‖ 원문: ' + lastRaw.slice(0, 300).replace(/\n/g, '⏎') : ''); } catch (e) {} };
  async function showPic(term, emoji, signal) {
    const seq = ++picSeq;
    let note = term ? `검색어 "${term}"` : '검색어 없음';
    if (term) {
      try {
        const tctl = new AbortController(); const t = setTimeout(() => tctl.abort(), 4000);
        signal?.addEventListener('abort', () => tctl.abort());
        const hit = await wikiImage(term, tctl.signal); clearTimeout(t);
        if (seq !== picSeq) return;
        if (hit) {
          const img = new Image(); img.alt = hit.title; img.src = hit.src;
          await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error('img')); });
          if (seq !== picSeq) return;
          figBox.innerHTML = ''; placePic('', `<b>${hit.title.replace(/</g, '&lt;')}</b><span>위키백과</span>`); figBox.append(img);
          picDbg(`${note} → 사진 "${hit.title}" 표시`); return;
        }
        note += ' → 위키백과에 사진 없음';
      } catch (e) { note += ' → ' + (e.name === 'AbortError' ? '4초 안에 응답 없음' : e.message === 'img' ? '사진 파일 로딩 실패' : '연결 실패(' + (e.message || e) + ')'); }
      if (seq !== picSeq) return;
    }
    if (emoji) { placePic(`<div class="emo">${emoji}</div>`, ''); picDbg(note + ` → 이모지 ${emoji}`); }
    else picDbg(note + ' → 이모지도 없음, 글만 표시');
  }

  // ---------- ask ----------
  async function ask(qIn) {
    const q = String(qIn ?? input.value).trim();
    if (!q || busy) return;
    if (!settings.apiKey) { setState('idle', '잠깐', '부모님이 설정에서 API 키를 넣어 줘야 해요.'); draw('아직 준비가 안 됐어. 부모님께 말해 줘.', false, 'plain'); return; }
    const blocked = gate(); if (blocked) { showBlocked(blocked); return; }
    keepAwake();
    busy = true; askBtn.disabled = true;
    input.value = ''; input.blur();
    lastQ = q; setEyebrow('q', q);
    if (/퀴즈|문제\s*내|수수께끼/.test(q)) quiz = true;
    setState('think', '생각 중', quiz ? '문제를 고르고 있어.' : '잠깐만.');
    setChips([]); hidePic(); setSpecial('');
    draw(quiz ? '문제를 고르고 있어…' : '음… 생각하고 있어.', false, 'soft');
    ctl?.abort(); ctl = new AbortController();
    const msgs = [];
    for (const r of recent) { msgs.push({ role: 'user', content: r.q }); msgs.push({ role: 'assistant', content: r.a }); }
    let userText = q;
    if (quiz) userText = '(지금은 퀴즈 중이야. 아이의 말은 답을 맞히려는 시도일 수 있어. 맞으면 "정답은 ○○!"으로 짧게 확인하고 한 줄 설명을 덧붙여. 틀리면 힌트를 하나만 더 줘.)\n' + q;
    msgs.push({ role: 'user', content: userText });
    try {
      const raw = await claude(msgs, { system: rules(), signal: ctl.signal });
      lastRaw = raw; picDbg('응답 받음 (' + raw.length + '자)');
      const { body: text, term, emoji, qs } = splitPic(raw);
      let a = text.replace(/[*#_`>]/g, '').replace(/\p{Extended_Pictographic}/gu, '').replace(/\s+/g, ' ').trim();
      const g = graphemes(a);
      if (g.length > 320) { // 문장 끝에서 자르기
        const cut = g.slice(0, 320).join('');
        const m = cut.match(/^[\s\S]*[.!?。](?=\s|$)/);
        a = (m && m[0].length > 120) ? m[0].trim() : cut.trim() + '…';
      }
      if (quiz && /정답은/.test(a)) quiz = false;
      current = a.replace(/[《》]/g, '');
      setChips(quiz ? ['힌트 줘', '정답 알려줘', '다른 문제'] : (qs && qs.length ? qs : ['왜?', '더 알려줘', '예를 들면?']), '이어서');
      draw(a, true, 'answer');
      setState(quiz ? 'quiz' : 'answer', quiz ? '퀴즈 중' : '답', quiz ? '답을 말해 봐. 모르겠으면 힌트를 눌러.' : '모르는 낱말은 눌러 봐.');
      speak(current);
      if (!term && !emoji && !/@@/.test(raw)) picDbg('답에 그림 줄(@@)이 안 왔음 — 모델이 규칙을 빼먹음'); else showPic(term, emoji, ctl.signal);
      recent.push({ q, a: current }); while (recent.length > 3) recent.shift();
      todayCount(1); renderCount();
      saveLog(q, current);
    } catch (e) {
      if (e.name === 'AbortError') { setState('idle', '멈췄어', '다시 물어봐도 돼.'); draw('멈췄어. 다시 물어봐.', false, 'soft'); return; }
      let msg = '잠깐 연결이 안 됐어. 다시 물어봐 줄래?';
      if (e.status === 401) msg = 'API 키가 맞지 않아. 부모님께 말해 줘.';
      else if (e.status === 400 && /credit|balance/i.test(e.detail || '')) msg = '충전이 필요해. 부모님께 말해 줘.';
      else if (e.status === 404) msg = '모델 이름이 맞지 않아. 부모님 설정에서 모델을 바꿔 줘.';
      else if (e.status === 429) msg = '조금 쉬었다가 다시 물어봐 줘.';
      current = msg; draw(msg, true, 'plain');
      setState('idle', '잠깐', e.detail ? ('오류: ' + String(e.detail).slice(0, 80)) : '마이크를 누르고 다시 해 봐.');
    } finally { busy = false; askBtn.disabled = false; touchIdle(); }
  }

  // ---------- keep screen on ----------
  async function keepAwake() {
    try { if (wakeLock || !('wakeLock' in navigator)) return; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !wakeLock) keepAwake(); });

  // ---------- parent: log (this device) ----------
  function saveLog(q, a) {
    const now = new Date(), k = 'gk-log-' + dayKey(now);
    const items = LS.get(k, []); items.push({ t: `${pad(now.getHours())}:${pad(now.getMinutes())}`, q, a });
    LS.set(k, items.slice(-200));
    try { // keep 30 days
      const keys = Object.keys(localStorage).filter(x => x.startsWith('gk-log-')).sort();
      while (keys.length > 30) localStorage.removeItem(keys.shift());
    } catch (e) {}
  }
  function loadDays(n) {
    let keys = []; try { keys = Object.keys(localStorage).filter(x => x.startsWith('gk-log-')).sort().reverse().slice(0, n); } catch (e) {}
    return keys.map(k => ({ day: k.slice(7), items: LS.get(k, []) })).filter(d => d.items.length);
  }
  function openLog() {
    logEl.hidden = false; $('summary').hidden = true; applySettingsUI();
    const days = loadDays(14);
    logBody.textContent = '';
    if (!days.length) { logBody.innerHTML = '<p class="empty">아직 물어본 질문이 없어요. 첫 질문을 하면 여기에 날짜별로 쌓여요.</p>'; return; }
    for (const data of days) {
      const box = document.createElement('div'); box.className = 'day';
      const h = document.createElement('h3'); h.textContent = data.day + ' · ' + data.items.length + '개';
      const ul = document.createElement('ul');
      for (const it of data.items.slice().reverse()) {
        const li = document.createElement('li');
        const t = document.createElement('div'); t.className = 't'; t.textContent = it.t;
        const qq = document.createElement('div'); qq.className = 'qq'; qq.textContent = it.q;
        const aa = document.createElement('div'); aa.textContent = it.a;
        li.append(t, qq, aa); ul.append(li);
      }
      box.append(h, ul); logBody.append(box);
    }
  }
  $('logClose').addEventListener('click', () => { logEl.hidden = true; touchIdle(); fit(); showPieceIfIdle(); });
  function showPieceIfIdle() { if (!recent.length && !busy) showPiece(false); }
  $('fsBtn').addEventListener('click', async () => {
    const el = document.documentElement;
    try { if (document.fullscreenElement) { await document.exitFullscreen(); return; } await el.requestFullscreen({ navigationUI: 'hide' }); logEl.hidden = true; setTimeout(fit, 300); }
    catch (e) { $('fsBtn').textContent = '전체 화면이 안 돼요. Chrome 메뉴 → 홈 화면에 추가를 써 보세요'; }
  });
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 300));

  // ---------- parent: weekly summary ----------
  $('sumBtn').addEventListener('click', async () => {
    const out = $('summary'), note = $('sumNote'), btn = $('sumBtn');
    if (!settings.apiKey) { note.textContent = 'API 키를 먼저 넣어 주세요.'; return; }
    btn.disabled = true; note.textContent = '정리하는 중…'; out.hidden = true;
    try {
      const days = loadDays(7);
      const lines = days.flatMap(d => d.items.map(it => `${d.day} ${it.t} Q: ${it.q} / A: ${it.a}`));
      if (!lines.length) { note.textContent = '최근 7일에 기록이 없어요.'; btn.disabled = false; return; }
      const text = await claude([{ role: 'user', content: `아래는 초등 2학년 아이(이해력은 중학생 수준)가 지난 7일 동안 집에 있는 AI 질문 화면에 물어본 질문과 답 기록이야. 부모가 읽을 짧은 주간 요약을 한국어로 써 줘. 형식:
1) 이번 주 관심 주제 (2~4개, 각 한 줄)
2) 눈에 띈 질문 (1~2개, 왜 인상적인지 한 줄)
3) 이번 주말에 같이 해볼 것 (책 1권 또는 간단한 실험·관찰 1개, 구체적으로)
전체 300자 이내, 마크다운 없이 번호와 줄바꿈만 써.

기록:
${lines.slice(-120).join('\n')}` }], { maxTokens: 600 });
      out.textContent = text; out.hidden = false; note.textContent = '최근 7일 기준';
    } catch (e) { note.textContent = '요약을 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.'; }
    finally { btn.disabled = false; }
  });

  // ⚙ + 비밀번호
  $('gearBtn').addEventListener('click', () => { pinEl.hidden = false; pinInput.value = ''; $('pinNote').textContent = ''; setTimeout(() => pinInput.focus(), 50); });
  $('pinCancel').addEventListener('click', () => { pinEl.hidden = true; });
  $('pinForm').addEventListener('submit', e => { e.preventDefault(); if (pinInput.value === String(settings.pin || '1234')) { pinEl.hidden = true; openLog(); } else { $('pinNote').textContent = '비밀번호가 달라요'; pinInput.value = ''; pinInput.focus(); } });
  $('pinSave').addEventListener('click', () => { const v = $('pinSet').value.trim(); if (!/^\d{4}$/.test(v)) { $('saved').textContent = '숫자 4자리로 적어 주세요'; return; } saveSettings({ pin: v }); });

  // long-press (2s) or 5 quick taps on the wordmark
  const title = $('title');
  let pressTimer = null, taps = 0, tapTimer = null;
  const pressStart = () => { clearTimeout(pressTimer); pressTimer = setTimeout(() => { pressTimer = null; openLog(); }, 1500); };
  const pressEnd = () => { clearTimeout(pressTimer); pressTimer = null; };
  title.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(); });
  ['pointerup', 'pointerleave'].forEach(ev => title.addEventListener(ev, pressEnd));
  // 터치 모니터/DeX에서 pointercancel이 먼저 오는 경우를 위해 touch 이벤트로도 잡는다
  title.addEventListener('touchstart', e => { e.preventDefault(); pressStart(); }, { passive: false });
  ['touchend', 'touchcancel'].forEach(ev => title.addEventListener(ev, pressEnd));
  title.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  title.addEventListener('contextmenu', e => e.preventDefault());
  title.addEventListener('click', () => { taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 1500); if (taps >= 5) { taps = 0; openLog(); } });

  // 확대 제스처 차단 (터치 모니터)
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTap = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTap < 300 && !e.target.closest('button, input, select, .w')) e.preventDefault(); lastTap = t; }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  // ---------- start ----------
  renderCount();
  fetchWeather().then(applyTheme).catch(() => {});
  showPiece(false);
  touchIdle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js'); navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'updated' && !busy && !listening) location.reload(); }); } catch (e) {} }
  if (!settings.apiKey) setTimeout(() => { if (!settings.apiKey) openLog(); }, 800);
})();
</script>
</body>
